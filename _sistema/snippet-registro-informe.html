<script>
(function(){
  try {
    if (!document.querySelector('link[rel*="icon"]')) {
      var fav = document.createElement('link');
      fav.rel = 'icon';
      fav.type = 'image/svg+xml';
      fav.href = 'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22540%20610%201300%201160%22%3E%3Cg%20transform%3D%22translate(0%2C2364)%20scale(1%2C-1)%22%3E%3Cpath%20fill%3D%22%235CB83E%22%20d%3D%22M1266%201638%20c-67%20-59%20-123%20-108%20-123%20-108%200%20-1%20129%20-214%20131%20-216%201%20-1%202%204%2018%2065%20l17%2064%20116%200%20115%200%200%20-3%20c-1%20-1%20-43%20-157%20-94%20-347%20-51%20-189%20-93%20-344%20-93%20-345%200%200%2051%200%20114%200%20l113%201%2014%2051%20c8%2028%2051%20188%2096%20355%20109%20402%20124%20459%20124%20460%200%201%20-62%201%20-229%201%20-218%200%20-229%200%20-229%202%201%202%2034%20127%2034%20128%200%201%20-17%20-13%20-124%20-108z%20M759%201528%20c-147%20-548%20-209%20-778%20-209%20-779%200%20-1%2073%20-1%20229%20-1%20125%200%20228%200%20228%200%200%200%20-8%20-30%20-17%20-65%20-9%20-35%20-17%20-65%20-16%20-65%200%200%201%201%203%202%201%202%2056%2050%20122%20107%2066%2058%20120%20106%20120%20106%201%201%20-18%2034%20-63%20108%20-75%20123%20-67%20110%20-67%20109%20-1%200%20-9%20-29%20-18%20-65%20l-17%20-64%20-115%200%20-115%200%200%203%20c1%202%20184%20687%20186%20690%200%202%20-6%202%20-114%202%20l-114%200%20-23%20-88z%22%3E%3C%2Fpath%3E%3C%2Fg%3E%3C%2Fsvg%3E';
      document.head.appendChild(fav);
    }
  } catch(e) {}
  try {
    var metaTipo = document.querySelector('meta[name="nexo-informe"]');
    var metaCliente = document.querySelector('meta[name="nexo-cliente"]');
    var metaPeriodo = document.querySelector('meta[name="nexo-periodo"]');

    var tipo = metaTipo ? (metaTipo.getAttribute('content') || '').trim().toLowerCase() : '';
    var cliente = metaCliente ? (metaCliente.getAttribute('content') || '').trim() : '';
    var periodo = metaPeriodo ? (metaPeriodo.getAttribute('content') || '').trim() : '';

    if (!tipo) {
      var p = window.location.pathname.toLowerCase();
      if (p.indexOf('meta-ads') !== -1) tipo = 'meta-ads';
      else if (p.indexOf('gestion') !== -1) tipo = 'gestion';
      else tipo = 'gestion';
    }

    var filename = window.location.pathname.split('/').pop() || '';
    var docId = filename.replace(/\.html$/i, '');
    if (!docId) return;

    var apiKey = "AIzaSyAsH9TxW0ld2aNQejJw6xxZW7fpZiw212Q";
    var projectId = "nexo-tableros-app";
    var baseDocUrl = "https://firestore.googleapis.com/v1/projects/" + encodeURIComponent(projectId) +
      "/databases/(default)/documents/informes/" + encodeURIComponent(docId);

    fetch(baseDocUrl + "?key=" + encodeURIComponent(apiKey))
      .then(function(res){
        if (res.status === 404) {
          var nowIso = new Date().toISOString();
          var pageUrl = window.location.href.split('?')[0].split('#')[0];
          var payload = {
            fields: {
              id: { stringValue: docId },
              tipo: { stringValue: tipo },
              cliente: { stringValue: cliente },
              periodo: { stringValue: periodo },
              url: { stringValue: pageUrl },
              registrado: { stringValue: nowIso }
            }
          };

          var createUrl = "https://firestore.googleapis.com/v1/projects/" + encodeURIComponent(projectId) +
            "/databases/(default)/documents/informes?documentId=" + encodeURIComponent(docId) +
            "&key=" + encodeURIComponent(apiKey);

          return fetch(createUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
        }
      })
      .catch(function(){
        // Silencioso: el cliente nunca debe ver errores
      });
  } catch(e) {
    // Silencioso
  }
})();
</script>
