        db = firebase.firestore();
        if (db && typeof db.enablePersistence === 'function') {
          db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
            console.warn('Persistencia Firestore:', err && err.code ? err.code : err);
          });
        }
        // Colección 'produccion': la que permiten las reglas y la que lee el banco de trabajo
        prodDocRef = db.collection('produccion').doc(DATA.id);

        const liveEl = document.getElementById('live-indicator');
        if (liveEl) liveEl.style.display = 'inline-flex';

        let isFirstSync = true;
        prodDocRef.onSnapshot((doc) => {
          if (!doc) return;
          if (doc.exists) {
            setFirestoreStatus(true);
            const remote = doc.data();
            if (isFirstSync) {
              isFirstSync = false;
              // Si Firestore está en estado inicial (todo por hacer) pero el usuario
              // ya tenía avance en su navegador (grabando o listo), subimos el avance local a Firestore
              const local = buildTarjetas(false);
              const remoteHasNoProgress = (!remote.grabando && !remote.listo) || (remote.todo === (remote.orden || []).length);
              const localHasProgress = (local.counts.grabando > 0 || local.counts.listo > 0);
              if (localHasProgress && remoteHasNoProgress) {
                syncToFirestore(null, true);
                return;
              }
            }
            if (doc.metadata && doc.metadata.hasPendingWrites) {
              // Modificación local en tránsito, evitar parpadeos
              return;
            }
            applyRemoteUpdate(remote);
          } else {
            seedFirestoreInitial();
          }
        }, (err) => {
          console.warn('Firestore offline o reglas restringidas:', err);
          setFirestoreStatus(false);
        });
      } catch (e) {
        console.warn('Error inicializando Firebase:', e);
        setFirestoreStatus(false);
      }
    }

    function setFirestoreStatus(online) {
      isFirestoreOnline = online;
      const live = document.getElementById('live-indicator');
      const label = document.getElementById('live-indicator-label');
      if (!live) return;
      if (online) {
        live.classList.add('online');
        if (label) label.textContent = 'En vivo';
      } else {
        live.classList.remove('online');
        if (label) label.textContent = 'Local';
      }
    }

    window.addEventListener('online', () => {
      setFirestoreStatus(true);
      if (prodDocRef) {
        const local = buildTarjetas(false);
        if (local.counts.grabando || local.counts.listo) {
          syncToFirestore(null, true);
        }
      }
    });

    window.addEventListener('offline', () => {
      setFirestoreStatus(false);
    });

    function buildTarjetas(forceTodo) {
      const orden = [];
      const tarjetas = {};
      const counts = { todo: 0, grabando: 0, listo: 0 };
      state.contenidos.forEach(raw => {
        const c = cleanCard(raw);
        if (!c || !c.id) return;
        if (forceTodo) {
          c.estado = 'todo';
          c.subtareas.forEach(st => st.done = false);
        }
        if (!(c.estado in counts)) c.estado = 'todo';
        orden.push(c.id);
        tarjetas[c.id] = c;
        counts[c.estado]++;
      });
      return { orden, tarjetas, counts };
    }

    let isSeeding = false;
    function seedFirestoreInitial() {
      if (!prodDocRef || !db || isSeeding) return;
      isSeeding = true;
      // Autorregistro: las reglas exigen que el documento nazca con todo en "Por hacer"
      const b = buildTarjetas(true);
      const nowIso = new Date().toISOString();
      const docData = {
        id: String(DATA.id),
        cliente: String(DATA.cliente || ''),
        fecha: String(DATA.fecha || ''),
        url: String(window.location.href.split('?')[0].split('#')[0]),
        registrado: nowIso,
        actualizado: nowIso,
        orden: b.orden,
        tarjetas: b.tarjetas,
        todo: b.orden.length,
        grabando: 0,
        listo: 0
      };
      db.runTransaction(tx => tx.get(prodDocRef).then(d => {
        if (!d.exists) tx.set(prodDocRef, docData);
      })).then(() => {
        isSeeding = false;
        setFirestoreStatus(true);
        // Si ya había avance local antes del registro, subirlo
        const local = buildTarjetas(false);
        if (local.counts.grabando || local.counts.listo) syncToFirestore(null, true);
      }).catch(err => {
        isSeeding = false;
        console.warn('Autorregistro produccion fallido:', err);
        setFirestoreStatus(false);
      });
    }

    function applyRemoteUpdate(remote) {
      if (!remote || !remote.tarjetas || typeof remote.tarjetas !== 'object') return;
      const orden = Array.isArray(remote.orden) ? remote.orden : Object.keys(remote.tarjetas);
      const remoteList = [];
      orden.forEach(id => { if (remote.tarjetas[id]) remoteList.push(remote.tarjetas[id]); });
      Object.keys(remote.tarjetas).forEach(id => { if (!orden.includes(id)) remoteList.push(remote.tarjetas[id]); });

      let changed = false;
      remoteList.forEach(rCard => {
        const local = state.contenidos.find(c => c.id === rCard.id);
        if (local) {
          if (local.estado !== rCard.estado) {
            local.estado = rCard.estado;
            changed = true;
          }
          if (rCard.subtareas && Array.isArray(rCard.subtareas)) {
            rCard.subtareas.forEach(rSub => {
              const lSub = (local.subtareas || []).find(s => s.id === rSub.id);
              if (lSub && lSub.done !== rSub.done) {
                lSub.done = rSub.done;
                changed = true;
              }
            });
          }
        } else {
          const cc = cleanCard(rCard);
          if (cc) { state.contenidos.push(cc); changed = true; }
        }
      });
      // Tarjetas borradas en otro dispositivo
      const remoteIds = new Set(remoteList.map(r => r.id));
      const before = state.contenidos.length;
      state.contenidos = state.contenidos.filter(c => remoteIds.has(c.id));
      if (state.contenidos.length !== before) changed = true;

      if (changed) {
        renderCards();
        saveStateLocalOnly();
        if (currentDrawerCardId) {
          const curr = state.contenidos.find(c => c.id === currentDrawerCardId);
          if (curr) updateDrawerContent(curr);
        }
      }
    }

    function syncToFirestore(cardId, isFullSync) {
      if (!prodDocRef || !isFirestoreOnline) return;
      const b = buildTarjetas(false);
      const payload = {
        orden: b.orden,
        tarjetas: b.tarjetas,
        todo: b.counts.todo,
        grabando: b.counts.grabando,
        listo: b.counts.listo,
        actualizado: new Date().toISOString()
      };
      prodDocRef.update(payload).catch(err => {
        console.error('Error sincronizando con Firestore:', err);
      });
    }

    // ── RENDER DE TARJETAS KANBAN ──────────────────────────────────────────
    function createCardElement(c, index) {
      const el = document.createElement('article');
      el.className = 'card' + (c.id === currentDrawerCardId ? ' is-active-drawer' : '');
      el.dataset.id = escapeHTML(c.id);
      el.dataset.cardStatus = escapeHTML(c.estado || 'todo');

      const tipoCfg = TIPOS[c.tipo] || TIPOS['otro'];
      const total = c.subtareas ? c.subtareas.length : 0;
      const done = c.subtareas ? c.subtareas.filter(s => s.done).length : 0;
      const pct = total ? Math.round((done / total) * 100) : 0;
      const hasRefs = c.mediaLinks && c.mediaLinks.length > 0;
      const hasSubtasks = total > 0;
      const seqNum = '#' + String(index + 1).padStart(2, '0');

      let sedeHtml = '';
      if (c.sede && c.sede.trim() !== '') {
        sedeHtml = `<div class="card-sede-pill"><i data-lucide="map-pin"></i>${escapeHTML(c.sede)}</div>`;
      }

      // Meta items inferiores (SOLO si existen)
      let metaItemsHtml = '';
      if (hasRefs) {
        metaItemsHtml += `
          <span class="card-meta-item" title="${c.mediaLinks.length} referencia(s) multimedia">
            <i data-lucide="link"></i> ${c.mediaLinks.length} ref${c.mediaLinks.length > 1 ? 's' : ''}
          </span>
        `;
      }
      if (hasSubtasks) {
        metaItemsHtml += `
          <div class="card-mini-progress" title="${done} de ${total} subtareas completadas">
            <span class="card-meta-item"><i data-lucide="check-square"></i> ${done}/${total}</span>
            <div class="card-mini-bar"><div class="card-mini-fill" style="width:${pct}%"></div></div>
          </div>
        `;
      }

      const bottomRowHtml = (hasRefs || hasSubtasks) ? `
        <div class="card-bottom-row">
          <div class="card-meta-tags">${metaItemsHtml}</div>
          <div class="card-drag-indicator" title="Arrastrar para mover">
            <i data-lucide="grip-vertical"></i>
          </div>
        </div>
      ` : `
        <div class="card-bottom-row" style="border-top:none; margin-top:2px; padding-top:0; justify-content:flex-end;">
          <div class="card-drag-indicator" title="Arrastrar para mover">
            <i data-lucide="grip-vertical"></i>
          </div>
        </div>
      `;

      el.innerHTML = `
        <div class="card-top">
          <div class="card-badges">
            <span class="card-seq-num">${seqNum}</span>
            <span class="card-type-badge" style="background:${tipoCfg.bg}; color:${tipoCfg.color}; border:1px solid ${tipoCfg.border}">
              ${escapeHTML(tipoCfg.label)}
            </span>
            ${sedeHtml}
          </div>
          <div class="card-actions">
            <button class="btn-card-action" onclick="toggleCardMenu(event, '${escapeHTML(c.id)}')" title="Opciones">
              <i data-lucide="more-horizontal"></i>
            </button>
            <div class="card-popover-menu" id="menu-${escapeHTML(c.id)}">
              <button class="popover-item" onclick="openDrawer('${escapeHTML(c.id)}')">
                <i data-lucide="maximize-2"></i> Ver detalle
              </button>
              <button class="popover-item" onclick="openModal('${escapeHTML(c.id)}')">
                <i data-lucide="edit-3"></i> Editar
              </button>
              <div class="popover-divider"></div>
              ${c.estado !== 'todo' ? `
                <button class="popover-item" onclick="quickMoveCard('${escapeHTML(c.id)}', 'todo')">
                  <i data-lucide="circle-dashed"></i> Mover a Por hacer
                </button>` : ''}
              ${c.estado !== 'grabando' ? `
                <button class="popover-item" onclick="quickMoveCard('${escapeHTML(c.id)}', 'grabando')">
                  <i data-lucide="play-circle" style="color:var(--nexo-orange);"></i> Mover a Grabando
                </button>` : ''}
              ${c.estado !== 'listo' ? `
                <button class="popover-item" onclick="quickMoveCard('${escapeHTML(c.id)}', 'listo')">
                  <i data-lucide="check-circle-2" style="color:var(--nexo-green);"></i> Mover a Listo
                </button>` : ''}
              <div class="popover-divider"></div>
              <button class="popover-item danger" onclick="deleteCard('${escapeHTML(c.id)}')">
                <i data-lucide="trash-2"></i> Eliminar
              </button>
            </div>
          </div>
        </div>
        <div class="card-title">${escapeHTML(c.titulo)}</div>
        ${c.descripcion ? `<div class="card-desc-preview">${escapeHTML(c.descripcion)}</div>` : ''}
        ${bottomRowHtml}
      `;

      // Clic para abrir el panel lateral de detalle (distinguiendo de arrastre)
      el.addEventListener('click', (e) => {
        if (isDragging) return;
        if (e.target.closest('.card-actions') || e.target.closest('.card-popover-menu')) return;
        openDrawer(c.id);
      });

      return el;
    }

    function toggleCardMenu(e, cardId) {
      e.stopPropagation();
      const menu = document.getElementById('menu-' + cardId);
      if (!menu) return;
      const isOpen = menu.classList.contains('show');
      closeAllCardMenus();
      if (!isOpen) {
        menu.classList.add('show');
        currentActiveMenuId = cardId;
      }
    }

    function closeAllCardMenus() {
      document.querySelectorAll('.card-popover-menu.show').forEach(m => m.classList.remove('show'));
      currentActiveMenuId = null;
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.card-actions')) closeAllCardMenus();
    });

    function quickMoveCard(cardId, newStatus) {
      closeAllCardMenus();
      const card = state.contenidos.find(c => c.id === cardId);
      if (!card || card.estado === newStatus) return;
      card.estado = newStatus;
      if (newStatus === 'listo') card.subtareas.forEach(s => s.done = true);
      else if (newStatus === 'todo') card.subtareas.forEach(s => s.done = false);
      updateUI();
      syncToFirestore(cardId, false);
      if (currentDrawerCardId === cardId) updateDrawerContent(card);
    }

    function openModalWithStatus(status) {
      modalPreselectedStatus = status || 'todo';
      openModal();
    }

    function renderCards() {
      const cols = {
        todo: document.getElementById('col-todo'),
        grabando: document.getElementById('col-grabando'),
        listo: document.getElementById('col-listo')
      };
      cols.todo.innerHTML = '';
      cols.grabando.innerHTML = '';
      cols.listo.innerHTML = '';

      let counts = { todo: 0, grabando: 0, listo: 0 };

      state.contenidos.forEach((c, idx) => {
        if (searchQuery) {
          const text = (c.titulo + ' ' + (c.descripcion || '')).toLowerCase();
          const subText = c.subtareas ? c.subtareas.map(s => s.texto).join(' ').toLowerCase() : '';
          const refText = c.mediaLinks ? c.mediaLinks.map(r => (r.label + ' ' + r.url)).join(' ').toLowerCase() : '';
          if (!text.includes(searchQuery) && !subText.includes(searchQuery) && !refText.includes(searchQuery)) return;
        }
        if (!c.estado) c.estado = 'todo';
        if (!c.subtareas) c.subtareas = [];
        if (!c.mediaLinks) c.mediaLinks = [];

        cols[c.estado].appendChild(createCardElement(c, idx));
        counts[c.estado]++;
      });

      // Indicadores de columnas vacías ultra-modernos e intencionales
      const emptyConfig = {
        todo: {
          icon: 'film',
          title: 'Sin contenidos pendientes',
          sub: 'Crea nuevas ideas o guiones listos para pre-producción',
          status: 'todo'
        },
        grabando: {
          icon: 'video',
          title: 'Nada en rodaje actualmente',
          sub: 'Arrastra tarjetas aquí al iniciar la grabación en set',
          status: 'grabando'
        },
        listo: {
          icon: 'check-circle-2',
          title: 'Aún no hay piezas listas',
          sub: 'Los contenidos grabados y aprobados aparecerán aquí',
          status: 'listo'
        }
      };

      ['todo', 'grabando', 'listo'].forEach(st => {
        if (counts[st] === 0) {
          const conf = emptyConfig[st];
          const empty = document.createElement('div');
          empty.className = 'k-empty-state';
          empty.innerHTML = `
            <div class="k-empty-icon-wrap"><i data-lucide="${conf.icon}"></i></div>
            <div class="k-empty-title">${conf.title}</div>
            <div class="k-empty-sub">${conf.sub}</div>
            <button class="k-empty-action-btn" onclick="openModalWithStatus('${conf.status}')">
              <i data-lucide="plus"></i> Crear tarjeta
            </button>
          `;
          cols[st].appendChild(empty);
        }
      });

      // Actualizar contadores en encabezados y pestañas móviles
      document.getElementById('count-todo').textContent = counts.todo;
      document.getElementById('count-grabando').textContent = counts.grabando;
      document.getElementById('count-listo').textContent = counts.listo;

      const mTodo = document.getElementById('m-count-todo');
      const mGrabando = document.getElementById('m-count-grabando');
      const mListo = document.getElementById('m-count-listo');
      if (mTodo) mTodo.textContent = counts.todo;
      if (mGrabando) mGrabando.textContent = counts.grabando;
      if (mListo) mListo.textContent = counts.listo;

      // Actualizar progreso global ("X de Y listos")
      const total = state.contenidos.length;
      const pct = total ? Math.round((counts.listo / total) * 100) : 0;
      const countEl = document.getElementById('hp-count');
      const fillEl = document.getElementById('hp-fill');
      if (countEl) countEl.textContent = `${counts.listo} de ${total}`;
      if (fillEl) fillEl.style.width = `${pct}%`;

      if (window.lucide) lucide.createIcons();
    }

    function updateUI() {
      renderCards();
      saveState();
    }

    // ── PANEL LATERAL DE DETALLE (SIDE DRAWER) ──────────────────────────
    function openDrawer(cardId) {
      closeAllCardMenus();
      const card = state.contenidos.find(c => c.id === cardId);
      if (!card) return;
      currentDrawerCardId = cardId;

      document.querySelectorAll('.card').forEach(el => {
        el.classList.toggle('is-active-drawer', el.dataset.id === cardId);
      });

      updateDrawerContent(card);

      document.getElementById('side-drawer').classList.add('show');
      document.getElementById('drawer-backdrop').classList.add('show');
    }

    function updateDrawerContent(card) {
      const tipoCfg = TIPOS[card.tipo] || TIPOS['otro'];
      const badge = document.getElementById('drawer-type-badge');
      if (badge) {
        badge.textContent = tipoCfg.label;
        badge.style.background = tipoCfg.bg;
        badge.style.color = tipoCfg.color;
        badge.style.border = '1px solid ' + tipoCfg.border;
      }

      const sedePill = document.getElementById('drawer-sede-pill');
      if (sedePill) {
        if (card.sede && card.sede.trim()) {
          sedePill.innerHTML = `<i data-lucide="map-pin"></i> ${escapeHTML(card.sede)}`;
          sedePill.style.display = 'inline-flex';
        } else {
          sedePill.style.display = 'none';
        }
      }

      const title = document.getElementById('drawer-title');
      if (title) title.textContent = card.titulo;

      // Botones segmentados de estado
      document.querySelectorAll('.status-seg-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.status === card.estado);
      });

      // Guión / Descripción
      const descSection = document.getElementById('drawer-desc-section');
      const descBox = document.getElementById('drawer-desc');
      if (card.descripcion && card.descripcion.trim()) {
        descBox.textContent = card.descripcion;
        descSection.style.display = 'flex';
      } else {
        descSection.style.display = 'none';
      }

      // Checklist de subtareas
      const checkSection = document.getElementById('drawer-check-section');
      const checkList = document.getElementById('drawer-checklist');
      const checkCount = document.getElementById('drawer-check-count');
      checkList.innerHTML = '';

      const subs = card.subtareas || [];
      const doneCount = subs.filter(s => s.done).length;
      checkCount.textContent = `${doneCount}/${subs.length}`;

      if (subs.length > 0) {
        checkSection.style.display = 'flex';
        subs.forEach(sub => {
          const item = document.createElement('div');
          item.className = 'drawer-check-item' + (sub.done ? ' done' : '');
          item.innerHTML = `
            <div class="drawer-check-box"><i data-lucide="check"></i></div>
            <div class="drawer-check-text">${escapeHTML(sub.texto)}</div>
          `;
          item.onclick = () => toggleSubtask(card.id, sub.id);
          checkList.appendChild(item);
        });
      } else {
        checkSection.style.display = 'none';
      }

      // Referencias multimedia
      const mediaSection = document.getElementById('drawer-media-section');
      const mediaGrid = document.getElementById('drawer-media-grid');
      mediaGrid.innerHTML = '';
      const links = card.mediaLinks || [];
      if (links.length > 0) {
        mediaSection.style.display = 'flex';
        links.forEach(l => {
          const a = document.createElement('a');
          a.className = 'drawer-media-link';
          a.href = l.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.innerHTML = `
            <div class="drawer-media-link-left">
              <i data-lucide="external-link"></i>
              <span>${escapeHTML(l.label || l.url)}</span>
            </div>
            <div class="drawer-media-link-ext"><i data-lucide="arrow-up-right"></i></div>
          `;
          mediaGrid.appendChild(a);
        });
      } else {
        mediaSection.style.display = 'none';
      }

      // Botón principal de avance de etapa
      const nextLabel = document.getElementById('drawer-next-label');
      if (card.estado === 'todo') {
        nextLabel.textContent = 'Comenzar rodaje';
      } else if (card.estado === 'grabando') {
        nextLabel.textContent = 'Marcar como listo';
      } else {
        nextLabel.textContent = 'Reiniciar rodaje';
      }

      if (window.lucide) lucide.createIcons();
    }

    function closeDrawer() {
      currentDrawerCardId = null;
      document.getElementById('side-drawer').classList.remove('show');
      document.getElementById('drawer-backdrop').classList.remove('show');
      document.querySelectorAll('.card.is-active-drawer').forEach(c => c.classList.remove('is-active-drawer'));
    }

    function setCardStatusFromDrawer(newStatus) {
      if (!currentDrawerCardId) return;
      quickMoveCard(currentDrawerCardId, newStatus);
    }

    function advanceCardFromDrawer() {
      if (!currentDrawerCardId) return;
      const card = state.contenidos.find(c => c.id === currentDrawerCardId);
      if (!card) return;
      if (card.estado === 'todo') quickMoveCard(card.id, 'grabando');
      else if (card.estado === 'grabando') quickMoveCard(card.id, 'listo');
      else quickMoveCard(card.id, 'todo');
    }

    function toggleSubtask(cardId, subId) {
      const card = state.contenidos.find(c => c.id === cardId);
      if (!card || !card.subtareas) return;
      const sub = card.subtareas.find(s => s.id === subId);
      if (!sub) return;
      sub.done = !sub.done;

      updateUI();
      syncToFirestore(cardId, false);
      if (currentDrawerCardId === cardId) updateDrawerContent(card);
    }

    function copyDrawerScript() {
      const desc = document.getElementById('drawer-desc').textContent;
      if (!desc) return;
      navigator.clipboard.writeText(desc).then(() => {
        const btn = document.getElementById('btn-copy-script');
        if (btn) {
          btn.innerHTML = `<i data-lucide="check"></i> <span>¡Copiado!</span>`;
          btn.style.color = 'var(--nexo-green)';
          btn.style.borderColor = 'var(--nexo-green)';
          if (window.lucide) lucide.createIcons();
          setTimeout(() => {
            btn.innerHTML = `<i data-lucide="copy"></i> <span>Copiar</span>`;
            btn.style.color = '';
            btn.style.borderColor = '';
            if (window.lucide) lucide.createIcons();
          }, 2000);
        }
      }).catch(err => {
        console.error('Error al copiar:', err);
      });
    }

    function editFromDrawer() {
      if (!currentDrawerCardId) return;
      const id = currentDrawerCardId;
      closeDrawer();
      openModal(id);
    }

    function deleteFromDrawer() {
      if (!currentDrawerCardId) return;
      const id = currentDrawerCardId;
      closeDrawer();
      deleteCard(id);
    }

    // ── MODAL DE CREACIÓN / EDICIÓN ─────────────────────────────────────
    function openModal(cardId) {
      const modal = document.getElementById('modal-card');
      const title = document.getElementById('modal-card-title');
      const form = document.getElementById('form-card');
      form.reset();

      if (cardId) {
        const c = state.contenidos.find(x => x.id === cardId);
        if (!c) return;
        title.textContent = 'Editar tarjeta de producción';
        document.getElementById('card-id').value = c.id;
        document.getElementById('card-title').value = c.titulo || '';
        document.getElementById('card-type').value = c.tipo || 'reel';
        document.getElementById('card-state').value = c.estado || 'todo';
        document.getElementById('card-sede').value = c.sede || '';
        document.getElementById('card-desc').value = c.descripcion || '';

        const subs = (c.subtareas || []).map(s => s.texto).join('\n');
        document.getElementById('card-subtasks-input').value = subs;

        const links = (c.mediaLinks || []).map(l => l.label ? `${l.label} | ${l.url}` : l.url).join('\n');
        document.getElementById('card-links-input').value = links;
      } else {
        title.textContent = 'Nueva tarjeta de producción';
        document.getElementById('card-id').value = '';
        document.getElementById('card-state').value = modalPreselectedStatus || 'todo';
      }

      modal.classList.add('show');
      setTimeout(() => document.getElementById('card-title').focus(), 50);
    }

    function closeModal() {
      document.getElementById('modal-card').classList.remove('show');
    }

    function handleModalOverlayClick(e) {
      if (e.target.id === 'modal-card') closeModal();
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('card-id').value;
      const titulo = document.getElementById('card-title').value.trim();
      if (!titulo) return;

      const tipo = document.getElementById('card-type').value;
      const estado = document.getElementById('card-state').value;
      const sede = document.getElementById('card-sede').value.trim();
      const descripcion = document.getElementById('card-desc').value.trim();

      // Subtareas
      const subLines = document.getElementById('card-subtasks-input').value.split('\n').map(s => s.trim()).filter(Boolean);
      let subtareas = [];
      if (id) {
        const prev = state.contenidos.find(x => x.id === id);
        const prevSubs = prev ? (prev.subtareas || []) : [];
        subtareas = subLines.map((line, idx) => {
          const matched = prevSubs.find(s => s.texto === line);
          return {
            id: matched ? matched.id : 'sub_' + Math.random().toString(36).substr(2, 7),
            texto: line,
            done: matched ? matched.done : false
          };
        });
      } else {
        subtareas = subLines.map(line => ({
          id: 'sub_' + Math.random().toString(36).substr(2, 7),
          texto: line,
          done: false
        }));
      }

      // Enlaces multimedia
      const linkLines = document.getElementById('card-links-input').value.split('\n').map(s => s.trim()).filter(Boolean);
      const mediaLinks = linkLines.map(l => {
        if (l.includes('|')) {
          const parts = l.split('|');
          return { label: parts[0].trim(), url: parts[1].trim() };
        }
        return { label: 'Referencia', url: l };
      });

      if (id) {
        const card = state.contenidos.find(x => x.id === id);
        if (card) {
          card.titulo = titulo;
          card.tipo = tipo;
          card.estado = estado;
          card.sede = sede;
          card.descripcion = descripcion;
          card.subtareas = subtareas;
          card.mediaLinks = mediaLinks;
        }
      } else {
        const newCard = {
          id: 'c_' + Math.random().toString(36).substr(2, 8),
          titulo,
          tipo,
          estado,
          sede,
          descripcion,
          subtareas,
          mediaLinks
        };
        state.contenidos.unshift(newCard);
      }

      closeModal();
      updateUI();
      syncToFirestore(id || null, true);
    }

    function deleteCard(cardId) {
      if (!confirm('¿Estás seguro de eliminar esta tarjeta de producción?')) return;
      state.contenidos = state.contenidos.filter(c => c.id !== cardId);
      if (currentDrawerCardId === cardId) closeDrawer();
      updateUI();
      syncToFirestore(cardId, true);
    }

    // ── DRAG AND DROP (SORTABLEJS) ──────────────────────────────────────────
    function initDragAndDrop() {
      const cols = ['col-todo', 'col-grabando', 'col-listo'];
      sortableInstances.forEach(s => s.destroy());
      sortableInstances = [];

      cols.forEach(colId => {
        const el = document.getElementById(colId);
        if (!el) return;

        const s = new Sortable(el, {
          group: 'kanban-board',
          animation: 180,
          ghostClass: 'sortable-ghost',
          chosenClass: 'sortable-chosen',
          handle: '.card-drag-indicator, .card-title, .card-top',
          delay: 150,
          delayOnTouchOnly: true,
          touchStartThreshold: 8,
          onStart: () => {
            isDragging = true;
            closeAllCardMenus();
          },
          onEnd: (evt) => {
            setTimeout(() => { isDragging = false; }, 50);
            const cardId = evt.item.dataset.id;
            const targetStatus = evt.to.dataset.status;
            if (!cardId || !targetStatus) return;

            const card = state.contenidos.find(c => c.id === cardId);
            if (card) {
              card.estado = targetStatus;
              if (targetStatus === 'listo') card.subtareas.forEach(s => s.done = true);
              // Reordenar state.contenidos según el orden visual en las columnas
              const domCardEls = Array.from(document.querySelectorAll('.kanban-column .card'));
              const domIds = domCardEls.map(el => el.dataset.id).filter(Boolean);
              if (domIds.length) {
                const map = new Map(state.contenidos.map(c => [c.id, c]));
                const newOrdered = [];
                domIds.forEach(id => { if (map.has(id)) newOrdered.push(map.get(id)); });
                state.contenidos.forEach(c => { if (!domIds.includes(c.id)) newOrdered.push(c); });
                state.contenidos = newOrdered;
              }
              updateUI();
              syncToFirestore(cardId, false);
            }
          }
        });
        sortableInstances.push(s);
      });
    }

    // ── BUSCADOR ────────────────────────────────────────────────────────────
    function setupSearch() {
      const input = document.getElementById('search-input');
      const mobileInput = document.getElementById('mobile-search-input');
      const clearBtn = document.getElementById('search-clear');
      const mobileClearBtn = document.getElementById('mobile-search-clear');

      function onSearch(val) {
        searchQuery = (val || '').trim().toLowerCase();
        if (input) input.value = val;
        if (mobileInput) mobileInput.value = val;

        const hasVal = Boolean(searchQuery);
        if (clearBtn) clearBtn.style.display = hasVal ? 'flex' : 'none';
        if (mobileClearBtn) mobileClearBtn.style.display = hasVal ? 'flex' : 'none';

        renderCards();
      }

      if (input) input.addEventListener('input', e => onSearch(e.target.value));
      if (mobileInput) mobileInput.addEventListener('input', e => onSearch(e.target.value));

      // Atajo de teclado ⌘K o Ctrl+K
      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          if (input) {
            input.focus();
            input.select();
          }
        } else if (e.key === 'Escape') {
          closeAllCardMenus();
          closeDrawer();
          closeModal();
        }
      });
    }

    function clearSearch() {
      searchQuery = '';
      const input = document.getElementById('search-input');
      const mobileInput = document.getElementById('mobile-search-input');
      if (input) input.value = '';
      if (mobileInput) mobileInput.value = '';
      document.getElementById('search-clear').style.display = 'none';
      const mClear = document.getElementById('mobile-search-clear');
      if (mClear) mClear.style.display = 'none';
      renderCards();
    }

    function toggleMobileSearch() {
      const bar = document.getElementById('mobile-search-bar');
      if (!bar) return;
      bar.classList.toggle('show');
      if (bar.classList.contains('show')) {
        const inp = document.getElementById('mobile-search-input');
        if (inp) inp.focus();
      }
    }

    // ── ADAPTACIÓN MÓVIL (PESTAÑAS) ─────────────────────────────────────────
    function switchMobileTab(tabKey) {
      document.querySelectorAll('.m-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabKey);
      });

      const colMap = {
        todo: 'section-todo',
        grabando: 'section-grabando',
        listo: 'section-listo'
      };

      document.querySelectorAll('.k-col').forEach(col => {
        col.classList.toggle('mobile-active', col.id === colMap[tabKey]);
      });
    }

    // ── DENSIDAD VISUAL ─────────────────────────────────────────────────────
    function setDensity(density) {
      const b = document.body;
      const btnCompact = document.getElementById('btn-density-compact');
      const btnComfortable = document.getElementById('btn-density-comfortable');

      if (density === 'comfortable') {
        b.classList.remove('density-compact');
        b.classList.add('density-comfortable');
        if (btnCompact) btnCompact.classList.remove('active');
        if (btnComfortable) btnComfortable.classList.add('active');
      } else {
        b.classList.remove('density-comfortable');
        b.classList.add('density-compact');
        if (btnComfortable) btnComfortable.classList.remove('active');
        if (btnCompact) btnCompact.classList.add('active');
      }
      localStorage.setItem('nexo-tablero-density', density);
    }

    // ── EXPORTACIÓN JSON ────────────────────────────────────────────────────
    function exportData() {
      const dataToExport = {
        cliente: state.cliente,
        fecha: state.fecha,
        exportedAt: new Date().toISOString(),
        totalContenidos: state.contenidos.length,
        contenidos: state.contenidos
      };

      const blob = new Blob([JSON.stringify(dataToExport, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `produccion-${slugify(state.cliente || 'nexo')}-${state.fecha || 'tablero'}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ── UTILIDADES ─────────────────────────────────────────────────────────
    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function slugify(s) {
      return String(s || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function formatDateFriendly(dateStr) {
      if (!dateStr) return 'Sin fecha';
      const m = String(dateStr).match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (m) {
        const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
        const day = m[3];
        const month = meses[parseInt(m[2], 10) - 1] || m[2];
        const year = m[1];
        return `${day} ${month} ${year}`;
      }
      return dateStr;
    }

    function cleanCard(c) {
      if (!c || typeof c !== 'object') return null;
      return {
        id: String(c.id || ''),
        titulo: String(c.titulo || ''),
        tipo: String(c.tipo || 'otro'),
        sede: String(c.sede || ''),
        estado: String(c.estado || 'todo'),
        descripcion: String(c.descripcion || ''),
        subtareas: Array.isArray(c.subtareas) ? c.subtareas.map(s => ({
          id: String(s.id || ''),
          texto: String(s.texto || ''),
          done: Boolean(s.done)
        })) : [],
        mediaLinks: Array.isArray(c.mediaLinks) ? c.mediaLinks.map(m => ({
          label: String(m.label || ''),
          url: String(m.url || '')
        })) : []
      };
    }

    function saveState() {
      localStorage.setItem(LS_KEY, JSON.stringify({
        cliente: state.cliente,
        fecha: state.fecha,
        contenidos: state.contenidos
      }));
    }

    function saveStateLocalOnly() {
      localStorage.setItem(LS_KEY, JSON.stringify({
        cliente: state.cliente,
        fecha: state.fecha,
        contenidos: state.contenidos
      }));
    }

    // ── FONDO ANIMADO DE CONEXIONES NEXO (CANVAS 2D ULTRA-LIGERO) ─────────
    function initNexoBackground() {
      const canvas = document.getElementById('nexo-bg-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let width = 0, height = 0;
      let mouseX = 0, mouseY = 0;
      let targetOffsetX = 0, targetOffsetY = 0;
      let currentOffsetX = 0, currentOffsetY = 0;
      let animId = null;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.scale(dpr, dpr);
      }
      resize();
      window.addEventListener('resize', resize);

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        targetOffsetX = (mouseX - width / 2) * 0.02;
        targetOffsetY = (mouseY - height / 2) * 0.02;
      });

      // Partículas y eslabones de conexión NEXO
      const nodes = [];
      const nodeCount = 28;
      for (let i = 0; i < nodeCount; i++) {
        nodes.push({
          x: Math.random(),
          y: Math.random(),
          vx: (Math.random() - 0.5) * 0.0003,
          vy: (Math.random() - 0.5) * 0.0003,
          size: 1.5 + Math.random() * 2,
          pulse: Math.random() * Math.PI * 2
        });
      }

      // Estructuras principales de enlaces orgánicos
      const shapes = [
        {
          xPct: 0.15, yPct: 0.25,
          radius: 240, length: 340, angle: 0.45,
          rotPeriod: 46000, driftX: 30, driftY: 20, driftPeriod: 32000,
          type: 'stadium'
        },
        {
          xPct: 0.85, yPct: 0.35,
          radius: 210, length: 300, angle: -0.6,
          rotPeriod: -48000, driftX: -25, driftY: 25, driftPeriod: 36000,
          type: 'double-loop'
        },
        {
          xPct: 0.50, yPct: 0.85,
          radius: 280, length: 440, angle: 0.25,
          rotPeriod: 52000, driftX: 35, driftY: -20, driftPeriod: 38000,
          type: 'stadium'
        },
        {
          xPct: 0.20, yPct: 0.88,
          radius: 190, length: 260, angle: 0.8,
          rotPeriod: -34000, driftX: -20, driftY: -25, driftPeriod: 30000,
          type: 'ribbon'
        }
      ];

      function drawStadium(ctx, len, r) {
        ctx.beginPath();
        const half = len / 2;
        ctx.moveTo(-half, -r);
        ctx.lineTo(half, -r);
        ctx.arc(half, 0, r, -Math.PI / 2, Math.PI / 2);
        ctx.lineTo(-half, r);
        ctx.arc(-half, 0, r, Math.PI / 2, -Math.PI / 2);
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        const rIn = r * 0.55;
        const halfIn = len * 0.35;
        ctx.moveTo(-halfIn, -rIn);
        ctx.lineTo(halfIn, -rIn);
        ctx.arc(halfIn, 0, rIn, -Math.PI / 2, Math.PI / 2);
        ctx.lineTo(-halfIn, rIn);
        ctx.arc(-halfIn, 0, rIn, Math.PI / 2, -Math.PI / 2);
        ctx.closePath();
        ctx.stroke();
      }

      function drawDoubleLoop(ctx, len, r) {
        drawStadium(ctx, len, r * 0.75);
        ctx.save();
        ctx.rotate(Math.PI / 3);
        drawStadium(ctx, len * 0.85, r * 0.65);
        ctx.restore();
      }

      function drawRibbon(ctx, len, r) {
        ctx.beginPath();
        ctx.moveTo(-len/2, -r);
        ctx.bezierCurveTo(-len/4, -r*1.5, len/4, r*1.5, len/2, r);
        ctx.bezierCurveTo(len/4, r*0.5, -len/4, -r*0.5, -len/2, -r);
        ctx.stroke();
      }

      function render(now) {
        ctx.clearRect(0, 0, width, height);

        currentOffsetX += (targetOffsetX - currentOffsetX) * 0.05;
        currentOffsetY += (targetOffsetY - currentOffsetY) * 0.05;

        const isDark = (document.documentElement.getAttribute('data-theme') || 'dark') === 'dark';
        const strokeGreen = isDark ? 'rgba(92, 184, 62, 0.09)' : 'rgba(92, 184, 62, 0.06)';
        const strokeBlue = isDark ? 'rgba(56, 189, 248, 0.06)' : 'rgba(31, 53, 73, 0.04)';
        const nodeColor = isDark ? 'rgba(92, 184, 62, 0.35)' : 'rgba(92, 184, 62, 0.25)';
        const filamentColor = isDark ? 'rgba(92, 184, 62, 0.07)' : 'rgba(31, 53, 73, 0.04)';

        // 1. Dibujar filamentos y nodos flotantes
        if (!prefersReduced) {
          for (let i = 0; i < nodes.length; i++) {
            nodes[i].x += nodes[i].vx;
            nodes[i].y += nodes[i].vy;
            if (nodes[i].x < 0) nodes[i].x = 1;
            if (nodes[i].x > 1) nodes[i].x = 0;
            if (nodes[i].y < 0) nodes[i].y = 1;
            if (nodes[i].y > 1) nodes[i].y = 0;
          }
        }

        // Conectar nodos cercanos
        for (let i = 0; i < nodes.length; i++) {
          const n1 = nodes[i];
          const x1 = n1.x * width + currentOffsetX * 0.3;
          const y1 = n1.y * height + currentOffsetY * 0.3;

          for (let j = i + 1; j < nodes.length; j++) {
            const n2 = nodes[j];
            const x2 = n2.x * width + currentOffsetX * 0.3;
            const y2 = n2.y * height + currentOffsetY * 0.3;
            const dx = x1 - x2;
            const dy = y1 - y2;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 180) {
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(x2, y2);
              ctx.strokeStyle = filamentColor;
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          }

          ctx.beginPath();
          ctx.arc(x1, y1, n1.size, 0, Math.PI * 2);
          ctx.fillStyle = nodeColor;
          ctx.fill();
        }

        // 2. Dibujar formas de conexión maestras
        shapes.forEach((s, idx) => {
          const tRot = prefersReduced ? 0 : (now / s.rotPeriod) * (Math.PI * 2);
          const tDrift = prefersReduced ? 0 : (now / s.driftPeriod) * (Math.PI * 2);

          const cx = (width * s.xPct) + (Math.sin(tDrift) * s.driftX) + currentOffsetX;
          const cy = (height * s.yPct) + (Math.cos(tDrift) * s.driftY) + currentOffsetY;

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(s.angle + tRot);
          ctx.strokeStyle = (idx % 2 === 0) ? strokeGreen : strokeBlue;
          ctx.lineWidth = 1.6;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          if (s.type === 'double-loop') drawDoubleLoop(ctx, s.length, s.radius);
          else if (s.type === 'ribbon') drawRibbon(ctx, s.length, s.radius);
          else drawStadium(ctx, s.length, s.radius);

          ctx.restore();
        });

        if (!prefersReduced && !document.hidden) {
          animId = requestAnimationFrame(render);
        }
      }

      animId = requestAnimationFrame(render);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (animId) cancelAnimationFrame(animId);
        } else {
          if (!prefersReduced) animId = requestAnimationFrame(render);
        }
      });
    }

    // ── INICIALIZACIÓN GENERAL ─────────────────────────────────────────────
    function init() {
      // Tema por defecto: dark (Dark Studio creativo)
      const savedTheme = localStorage.getItem('nexo-tablero-theme') || 'dark';
      setTheme(savedTheme);

      const savedDensity = localStorage.getItem('nexo-tablero-density') || 'compact';
      setDensity(savedDensity);

      const local = localStorage.getItem(LS_KEY);
      if (local) {
        try {
          const parsed = JSON.parse(local);
          if (parsed.fecha === DATA.fecha && parsed.cliente === DATA.cliente) {
            state = JSON.parse(JSON.stringify(DATA));
            state.contenidos.forEach(card => {
              const saved = (parsed.contenidos || []).find(c => c.id === card.id);
              if (saved) {
                card.estado = saved.estado || card.estado;
                card.subtareas.forEach(sub => {
                  const savedSub = (saved.subtareas || []).find(s => s.id === sub.id);
                  if (savedSub) sub.done = savedSub.done;
                });
              }
            });
          } else {
            state = JSON.parse(JSON.stringify(DATA));
          }
        } catch (e) {
          state = JSON.parse(JSON.stringify(DATA));
        }
      } else {
        state = JSON.parse(JSON.stringify(DATA));
      }

      // Asegurar estructura
      if (!Array.isArray(state.contenidos)) state.contenidos = [];
      state.contenidos.forEach((c, i) => {
        if (!c.id) c.id = 'c' + (i + 1);
        if (!c.estado) c.estado = 'todo';
        if (!c.subtareas) c.subtareas = [];
        if (!c.mediaLinks) c.mediaLinks = [];
      });

      // Renderizar datos del cliente y fecha en encabezado
      if (state.cliente) document.getElementById('hdr-client').textContent = state.cliente;
      if (state.fecha) document.getElementById('hdr-date').textContent = formatDateFriendly(state.fecha);

      renderCards();
      initDragAndDrop();
      setupSearch();
      initFirebase();
      initNexoBackground();

      // Deep linking con hash: #card-c1 abre el drawer
      if (window.location.hash) {
        const hash = window.location.hash.replace('#', '');
        if (hash.startsWith('card-')) {
          const cId = hash.replace('card-', '');
          setTimeout(() => openDrawer(cId), 150);
        }
      }
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
