  <!-- ENCABEZADO ULTRA-MODERNO -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <div class="nexo-logo-badge" title="NEXO Agencia Creativa">
          <svg viewBox="540 610 1300 1160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(0,2364) scale(1,-1)">
              <path fill="#5CB83E" d="M1266 1638 c-67 -59 -123 -108 -123 -108 0 -1 129 -214 131 -216 1 -1 2 4 18 65 l17 64 116 0 115 0 0 -3 c-1 -1 -43 -157 -94 -347 -51 -189 -93 -344 -93 -345 0 0 51 0 114 0 l113 1 14 51 c8 28 51 188 96 355 109 402 124 459 124 460 0 1 -62 1 -229 1 -218 0 -229 0 -229 2 1 2 34 127 34 128 0 1 -17 -13 -124 -108z M759 1528 c-147 -548 -209 -778 -209 -779 0 -1 73 -1 229 -1 125 0 228 0 228 0 0 0 -8 -30 -17 -65 -9 -35 -17 -65 -16 -65 0 0 1 1 3 2 1 2 56 50 122 107 66 58 120 106 120 106 1 1 -18 34 -63 108 -75 123 -67 110 -67 109 -1 0 -9 -29 -18 -65 l-17 -64 -115 0 -115 0 0 3 c1 2 184 687 186 690 0 2 -6 2 -114 2 l-114 0 -23 -88z"/>
            </g>
          </svg>
        </div>
        <div class="topbar-titles">
          <h1 id="hdr-client" class="client-title">Tablero NEXO</h1>
          <span class="prod-pill">PRODUCCIÓN</span>
          <span class="header-sep">·</span>
          <span id="hdr-date" class="client-date">Sin Fecha</span>
        </div>
      </div>

      <!-- Buscador compacto Linear-style en escritorio -->
      <div class="topbar-center">
        <div class="compact-search">
          <svg class="ico"><use href="#i-search"></use></svg>
          <input type="text" id="search-input" placeholder="Buscar tarjetas..." autocomplete="off">
          <kbd class="search-kbd" onclick="document.getElementById('search-input').focus()">⌘K</kbd>
          <button id="search-clear" class="btn-search-clear" onclick="clearSearch()" title="Limpiar"><svg class="ico"><use href="#i-x"></use></svg></button>
        </div>
      </div>

      <div class="topbar-right">
        <!-- Selector de densidad Compacta / Cómoda -->
        <div class="density-toggle" title="Densidad visual del tablero">
          <button class="density-btn" id="btn-density-compact" onclick="setDensity('compact')">Compacta</button>
          <button class="density-btn active" id="btn-density-comfortable" onclick="setDensity('comfortable')">Cómoda</button>
        </div>

        <!-- Selector de tema Oscuro / Claro -->
        <button class="btn-icon-top" id="btn-theme-toggle" onclick="toggleTheme()" title="Cambiar tema (Oscuro / Claro)">
          <svg class="ico" id="theme-toggle-icon"><use href="#i-sun"></use></svg>
        </button>

        <!-- Progreso global discreto -->
        <div class="header-progress-box" title="Progreso de producción">
          <div class="hp-info"><span id="hp-count">0 de 0</span> listos</div>
          <div class="hp-bar-track">
            <div class="hp-bar-fill" id="hp-fill" style="width: 0%"></div>
          </div>
        </div>

        <!-- Estado en vivo Firestore -->
        <div id="live-indicator" class="live-status" style="display:none;" title="Sincronización en la nube" aria-label="En vivo">
          <span class="live-dot"></span>
          <span id="live-indicator-label" class="live-label-text visually-hidden-mobile">En vivo</span>
        </div>

        <!-- Botón buscar móvil -->
        <button class="btn-icon-top btn-mobile-search-toggle" onclick="toggleMobileSearch()" title="Buscar">
          <svg class="ico"><use href="#i-search"></use></svg>
        </button>

        <!-- Botón Exportar -->
        <button class="btn-icon-top" onclick="exportData()" title="Exportar datos (JSON)">
          <svg class="ico"><use href="#i-download"></use></svg>
        </button>

        <!-- Botón Crear Tarjeta -->
        <button class="btn-primary-top" onclick="openModal()">
          <svg class="ico"><use href="#i-plus"></use></svg> <span>Nueva tarjeta</span>
        </button>
      </div>
    </div>
  </header>

  <!-- BUSCADOR MÓVIL DESPLEGABLE -->
  <div id="mobile-search-bar" class="mobile-search-bar">
    <div class="compact-search" style="width:100%;">
      <svg class="ico"><use href="#i-search"></use></svg>
      <input type="text" id="mobile-search-input" placeholder="Buscar tarjetas..." autocomplete="off">
      <button id="mobile-search-clear" class="btn-search-clear" onclick="clearSearch()" title="Limpiar"><svg class="ico"><use href="#i-x"></use></svg></button>
    </div>
  </div>

  <!-- PESTAÑAS MÓVILES (RODAJE CON 1 MANO) -->
  <nav class="mobile-col-tabs" aria-label="Columnas de producción">
    <button class="m-tab-btn active" data-tab="todo" onclick="switchMobileTab('todo')">
      Por hacer <span class="m-tab-count" id="m-count-todo">0</span>
    </button>
    <button class="m-tab-btn" data-tab="grabando" onclick="switchMobileTab('grabando')">
      Grabando <span class="m-tab-count" id="m-count-grabando">0</span>
    </button>
    <button class="m-tab-btn" data-tab="listo" onclick="switchMobileTab('listo')">
      Listo <span class="m-tab-count" id="m-count-listo">0</span>
    </button>
  </nav>

  <!-- MESA KANBAN -->
  <main class="kanban-area" id="kanban-canvas">
    <!-- COLUMNA: POR HACER -->
    <section class="k-col mobile-active" id="section-todo" data-status="todo">
      <div class="k-col-head">
        <div class="k-col-title-group">
          <div class="k-col-icon-wrap"><svg class="ico k-col-icon"><use href="#i-circle-dashed"></use></svg></div>
          <h2 class="k-col-title">Por hacer</h2>
        </div>
        <div class="k-col-right-group">
          <span class="k-col-count-badge" id="count-todo">0</span>
          <button class="k-col-add-btn" onclick="openModalWithStatus('todo')" title="Añadir tarjeta a Por hacer">
            <svg class="ico"><use href="#i-plus"></use></svg>
          </button>
        </div>
      </div>
      <div class="k-col-cards" id="col-todo" data-status="todo"></div>
    </section>

    <!-- COLUMNA: GRABANDO -->
    <section class="k-col" id="section-grabando" data-status="grabando">
      <div class="k-col-head">
        <div class="k-col-title-group">
          <div class="k-col-icon-wrap"><svg class="ico k-col-icon"><use href="#i-video"></use></svg></div>
          <h2 class="k-col-title">Grabando</h2>
        </div>
        <div class="k-col-right-group">
          <span class="k-col-count-badge" id="count-grabando">0</span>
          <button class="k-col-add-btn" onclick="openModalWithStatus('grabando')" title="Añadir tarjeta a Grabando">
            <svg class="ico"><use href="#i-plus"></use></svg>
          </button>
        </div>
      </div>
      <div class="k-col-cards" id="col-grabando" data-status="grabando"></div>
    </section>

    <!-- COLUMNA: LISTO -->
    <section class="k-col" id="section-listo" data-status="listo">
      <div class="k-col-head">
        <div class="k-col-title-group">
          <div class="k-col-icon-wrap"><svg class="ico k-col-icon"><use href="#i-check-circle-2"></use></svg></div>
          <h2 class="k-col-title">Listo</h2>
        </div>
        <div class="k-col-right-group">
          <span class="k-col-count-badge" id="count-listo">0</span>
          <button class="k-col-add-btn" onclick="openModalWithStatus('listo')" title="Añadir tarjeta a Listo">
            <svg class="ico"><use href="#i-plus"></use></svg>
          </button>
