  <!-- ENCABEZADO ULTRA-MODERNO -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <div class="nexo-logo-badge" title="NEXO Agencia Creativa">
          <svg viewBox="540 610 1300 1160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(0,2364) scale(1,-1)">
              <path fill="#5CB83E" d="M1266 1638 c-67 -59 -123 -108 -123 -108 0 -1 129 -214 131 -216 1 -1 2 4 18 65 l17 64 116 0 115 0 0 -3 c-1 -1 -43 -157 -94 -347 -51 -189 -93 -344 -93 -345 0 0 51 0 114 0 l113 1 14 51 c8 28 51 188 96 355 109 402 124 459 124 460 0 1 -62 1 -229 1 -218 0 -229 0 -229 2 1 2 34 127 34 128 0 1 -17 -13 -124 -108z M759 1528 c-147 -548 -209 -778 -209 -779 0 -1 73 -1 229 -1 125 0 228 0 228 0 0 0 -8 -30 -17 -65 -9 -35 -17 -65 -16 -65 0 0 1 1 3 2 1 2 56 50 122 107 66 58 120 106 120 106 1 1 -18 34 -63 108 -75 123 -67 110 -67 109 -1 0 -9 -29 -18 -65 l-17 -64 -115 0 -115 0 0 3 c1 2 184 687 186 690 0 2 -6 2 -114 2 l-114 0 -23 -88z"/>
            </g>
          </svg>
        </div>
        <div class="topbar-titles">
          <h1 id="hdr-client" class="client-title">Tablero NEXO</h1>
          <span class="prod-pill">PRODUCCIÓN</span>
          <span class="header-sep">·</span>
          <span id="hdr-date" class="client-date">Sin Fecha</span>
        </div>
      </div>

      <!-- Buscador compacto Linear-style en escritorio -->
      <div class="topbar-center">
        <div class="compact-search">
          <svg class="ico"><use href="#i-search"></use></svg>
          <input type="text" id="search-input" placeholder="Buscar tarjetas..." autocomplete="off">
          <kbd class="search-kbd" onclick="document.getElementById('search-input').focus()">⌘K</kbd>
          <button id="search-clear" class="btn-search-clear" onclick="clearSearch()" title="Limpiar"><svg class="ico"><use href="#i-x"></use></svg></button>
        </div>
      </div>

      <div class="topbar-right">
        <!-- Selector de densidad Compacta / Cómoda -->
        <div class="density-toggle" title="Densidad visual del tablero">
          <button class="density-btn" id="btn-density-compact" onclick="setDensity('compact')">Compacta</button>
          <button class="density-btn active" id="btn-density-comfortable" onclick="setDensity('comfortable')">Cómoda</button>
        </div>

        <!-- Selector de tema Oscuro / Claro -->
        <button class="btn-icon-top" id="btn-theme-toggle" onclick="toggleTheme()" title="Cambiar tema (Oscuro / Claro)">
          <svg class="ico" id="theme-toggle-icon"><use href="#i-sun"></use></svg>
        </button>

        <!-- Progreso global discreto -->
        <div class="header-progress-box" title="Progreso de producción">
          <div class="hp-info"><span id="hp-count">0 de 0</span> listos</div>
          <div class="hp-bar-track">
            <div class="hp-bar-fill" id="hp-fill" style="width: 0%"></div>
          </div>
        </div>

        <!-- Estado en vivo Firestore -->
        <div id="live-indicator" class="live-status" style="display:none;" title="Sincronización en la nube" aria-label="En vivo">
          <span class="live-dot"></span>
          <span id="live-indicator-label" class="live-label-text visually-hidden-mobile">En vivo</span>
        </div>

        <!-- Botón buscar móvil -->
        <button class="btn-icon-top btn-mobile-search-toggle" onclick="toggleMobileSearch()" title="Buscar">
          <svg class="ico"><use href="#i-search"></use></svg>
        </button>

        <!-- Botón Exportar -->
        <button class="btn-icon-top" onclick="exportData()" title="Exportar datos (JSON)">
          <svg class="ico"><use href="#i-download"></use></svg>
        </button>

        <!-- Botón Crear Tarjeta -->
        <button class="btn-primary-top" onclick="openModal()">
          <svg class="ico"><use href="#i-plus"></use></svg> <span>Nueva tarjeta</span>
        </button>
      </div>
    </div>
  </header>

  <!-- BUSCADOR MÓVIL DESPLEGABLE -->
  <div id="mobile-search-bar" class="mobile-search-bar">
    <div class="compact-search" style="width:100%;">
      <svg class="ico"><use href="#i-search"></use></svg>
      <input type="text" id="mobile-search-input" placeholder="Buscar tarjetas..." autocomplete="off">
      <button id="mobile-search-clear" class="btn-search-clear" onclick="clearSearch()" title="Limpiar"><svg class="ico"><use href="#i-x"></use></svg></button>
    </div>
  </div>

  <!-- PESTAÑAS MÓVILES (RODAJE CON 1 MANO) -->
  <nav class="mobile-col-tabs" aria-label="Columnas de producción">
    <button class="m-tab-btn active" data-tab="todo" onclick="switchMobileTab('todo')">
      Por hacer <span class="m-tab-count" id="m-count-todo">0</span>
    </button>
    <button class="m-tab-btn" data-tab="grabando" onclick="switchMobileTab('grabando')">
      Grabando <span class="m-tab-count" id="m-count-grabando">0</span>
    </button>
    <button class="m-tab-btn" data-tab="listo" onclick="switchMobileTab('listo')">
      Listo <span class="m-tab-count" id="m-count-listo">0</span>
    </button>
  </nav>

  <!-- MESA KANBAN -->
  <main class="kanban-area" id="kanban-canvas">
    <!-- COLUMNA: POR HACER -->
    <section class="k-col mobile-active" id="section-todo" data-status="todo">
      <div class="k-col-head">
        <div class="k-col-title-group">
          <div class="k-col-icon-wrap"><svg class="ico k-col-icon"><use href="#i-circle-dashed"></use></svg></div>
          <h2 class="k-col-title">Por hacer</h2>
        </div>
        <div class="k-col-right-group">
          <span class="k-col-count-badge" id="count-todo">0</span>
          <button class="k-col-add-btn" onclick="openModalWithStatus('todo')" title="Añadir tarjeta a Por hacer">
            <svg class="ico"><use href="#i-plus"></use></svg>
          </button>
        </div>
      </div>
      <div class="k-col-cards" id="col-todo" data-status="todo"></div>
    </section>

    <!-- COLUMNA: GRABANDO -->
    <section class="k-col" id="section-grabando" data-status="grabando">
      <div class="k-col-head">
        <div class="k-col-title-group">
          <div class="k-col-icon-wrap"><svg class="ico k-col-icon"><use href="#i-video"></use></svg></div>
          <h2 class="k-col-title">Grabando</h2>
        </div>
        <div class="k-col-right-group">
          <span class="k-col-count-badge" id="count-grabando">0</span>
          <button class="k-col-add-btn" onclick="openModalWithStatus('grabando')" title="Añadir tarjeta a Grabando">
            <svg class="ico"><use href="#i-plus"></use></svg>
          </button>
        </div>
      </div>
      <div class="k-col-cards" id="col-grabando" data-status="grabando"></div>
    </section>

    <!-- COLUMNA: LISTO -->
    <section class="k-col" id="section-listo" data-status="listo">
      <div class="k-col-head">
        <div class="k-col-title-group">
          <div class="k-col-icon-wrap"><svg class="ico k-col-icon"><use href="#i-check-circle-2"></use></svg></div>
          <h2 class="k-col-title">Listo</h2>
        </div>
        <div class="k-col-right-group">
          <span class="k-col-count-badge" id="count-listo">0</span>
          <button class="k-col-add-btn" onclick="openModalWithStatus('listo')" title="Añadir tarjeta a Listo">
            <svg class="ico"><use href="#i-plus"></use></svg>
          </button>
        </div>
      </div>
      <div class="k-col-cards" id="col-listo" data-status="listo"></div>
    </section>
  </main>

  <!-- ── FICHA CENTRADA DE LA TARJETA (v3) ─────────────────────────────
       Conserva los id del panel anterior (side-drawer, drawer-*) para no romper la lógica existente -->
  <div id="drawer-backdrop" class="ps-backdrop" onclick="closeDrawer()"></div>
  <aside id="side-drawer" class="ps" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
    <div class="ps-panel" tabindex="-1">
      <div class="ps-grabber" aria-hidden="true"></div>
      <header class="ps-head">
        <div class="ps-head-left">
          <span class="ps-num" id="ps-num">01</span>
          <span id="drawer-type-badge" class="card-type-badge ps-type"></span>
          <span id="ps-ads" class="ps-chip ps-chip-ads" style="display:none;">ADS</span>
          <span id="ps-hora" class="ps-chip" style="display:none;"></span>
          <span id="drawer-sede-pill" class="ps-chip" style="display:none;"></span>
        </div>
        <div class="ps-head-right">
          <span class="ps-pos" id="ps-pos"></span>
          <button type="button" class="ps-icon" id="ps-prev" onclick="navigateSheet(-1)" title="Tarjeta anterior (←)" aria-label="Tarjeta anterior"><svg class="ico"><use href="#i-chevron-left"></use></svg></button>
          <button type="button" class="ps-icon" id="ps-next" onclick="navigateSheet(1)" title="Tarjeta siguiente (→)" aria-label="Tarjeta siguiente"><svg class="ico"><use href="#i-chevron-right"></use></svg></button>
          <span class="ps-divider" aria-hidden="true"></span>
          <button type="button" class="ps-icon" onclick="editFromDrawer()" title="Editar formato, sede y referencias" aria-label="Editar formato, sede y referencias"><svg class="ico"><use href="#i-sliders-horizontal"></use></svg></button>
          <button type="button" class="ps-icon ps-danger" onclick="deleteFromDrawer()" title="Eliminar tarjeta" aria-label="Eliminar tarjeta"><svg class="ico"><use href="#i-trash-2"></use></svg></button>
          <button type="button" class="ps-close" id="ps-close" onclick="closeDrawer()" title="Cerrar (Esc)" aria-label="Cerrar"><svg class="ico"><use href="#i-x"></use></svg></button>
        </div>
      </header>

      <div class="ps-body">
        <div class="ps-main">
          <textarea id="drawer-title" class="ps-title" rows="1" spellcheck="false" aria-label="Título de la tarjeta" placeholder="Título del contenido"></textarea>

          <div class="ps-status status-segmented-control" role="group" aria-label="Estado de producción">
            <button type="button" class="status-seg-btn" data-status="todo" onclick="setCardStatusFromDrawer('todo')">
              <svg class="ico"><use href="#i-circle-dashed"></use></svg> Por hacer
            </button>
            <button type="button" class="status-seg-btn" data-status="grabando" onclick="setCardStatusFromDrawer('grabando')">
              <svg class="ico"><use href="#i-video"></use></svg> Grabando
            </button>
            <button type="button" class="status-seg-btn" data-status="listo" onclick="setCardStatusFromDrawer('listo')">
              <svg class="ico"><use href="#i-check-circle-2"></use></svg> Listo
            </button>
          </div>

          <section class="ps-sec ps-sec-script" id="drawer-desc-section">
            <div class="ps-sec-head">
              <h3 class="ps-sec-label"><svg class="ico"><use href="#i-file-text"></use></svg> Guion</h3>
              <span class="ps-sec-meta" id="ps-script-meta"></span>
              <div class="ps-sec-actions">
                <button type="button" class="ps-btn-ghost" id="btn-edit-script" onclick="toggleScriptEdit()"><svg class="ico"><use href="#i-pencil"></use></svg> <span>Editar</span></button>
                <button type="button" class="ps-btn-ghost" id="btn-copy-script" onclick="copyDrawerScript()"><svg class="ico"><use href="#i-copy"></use></svg> <span>Copiar</span></button>
              </div>
            </div>
            <div id="drawer-desc" class="ps-script"></div>
            <textarea id="ps-script-editor" class="ps-script-editor" spellcheck="false" aria-label="Editar guion" style="display:none;"></textarea>
            <button type="button" class="ps-empty" id="ps-script-empty" onclick="toggleScriptEdit(true)" style="display:none;">
              <svg class="ico"><use href="#i-pen-line"></use></svg> Sin guion todavía. Toca para escribirlo.
            </button>
          </section>
        </div>

        <div class="ps-side">
          <section class="ps-sec ps-sec-notes" id="ps-notes-section">
            <div class="ps-sec-head">
              <h3 class="ps-sec-label"><svg class="ico"><use href="#i-notebook-pen"></use></svg> Notas en vivo</h3>
              <span class="ps-save" id="ps-notes-status" aria-live="polite"></span>
            </div>
            <textarea id="ps-notes" class="ps-notes" rows="3" aria-label="Notas de rodaje" placeholder="Escribe lo que pase en el set: tomas buenas, cambios, pendientes… Se guarda solo y se ve en todos los teléfonos."></textarea>
          </section>

          <section class="ps-sec" id="drawer-check-section">
            <div class="ps-sec-head">
              <h3 class="ps-sec-label"><svg class="ico"><use href="#i-list-checks"></use></svg> Checklist</h3>
              <span id="drawer-check-count" class="ps-sec-meta">0/0</span>
              <div class="ps-sec-actions">
                <button type="button" class="ps-btn-ghost" id="btn-edit-checklist" onclick="toggleChecklistEdit()"><svg class="ico"><use href="#i-pencil"></use></svg> <span>Editar</span></button>
              </div>
            </div>
            <div class="ps-check-track" aria-hidden="true"><div class="ps-check-fill" id="ps-check-fill"></div></div>
            <div id="drawer-checklist" class="ps-checklist"></div>
            <form class="ps-check-add" onsubmit="addSubtaskFromSheet(event)">
              <svg class="ico"><use href="#i-plus"></use></svg>
              <input type="text" id="ps-check-input" autocomplete="off" placeholder="Agregar paso o toma…" aria-label="Agregar paso al checklist">
              <button type="submit" class="ps-check-add-btn">Agregar</button>
            </form>
          </section>

          <section class="ps-sec" id="drawer-media-section" style="display:none;">
            <div class="ps-sec-head">
              <h3 class="ps-sec-label"><svg class="ico"><use href="#i-paperclip"></use></svg> Referencias</h3>
            </div>
            <div id="drawer-media-grid" class="ps-media"></div>
          </section>
        </div>
      </div>

      <footer class="ps-foot">
        <button type="button" class="ps-advance" id="btn-drawer-next-step" onclick="advanceCardFromDrawer()">
          <span class="ps-advance-icon" id="ps-advance-icon"><svg class="ico"><use href="#i-play"></use></svg></span>
          <span id="drawer-next-label">Comenzar rodaje</span>
        </button>
      </footer>
    </div>
  </aside>

  <!-- ── MODAL DE CREACIÓN / EDICIÓN ───────────────────────────────────── -->
  <div id="modal-card" class="modal-overlay" onclick="handleModalOverlayClick(event)">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 id="modal-card-title" class="modal-title">Nueva tarjeta de producción</h3>
        <button class="btn-icon-top" onclick="closeModal()"><svg class="ico"><use href="#i-x"></use></svg></button>
      </div>
      <form id="form-card" onsubmit="handleFormSubmit(event)">
        <div class="modal-body">
          <input type="hidden" id="card-id">

          <div class="form-group">
            <label class="form-label" for="card-title">Título o Gancho Principal *</label>
            <input type="text" id="card-title" class="form-input" required placeholder="Ej: POV: Probando el nuevo menú...">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="card-type">Formato *</label>
              <select id="card-type" class="form-select">
                <option value="reel">Reel</option>
                <option value="carrusel">Carrusel</option>
                <option value="tiktok">TikTok</option>
                <option value="foto">Foto</option>
                <option value="otro">Otro</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="card-state">Estado *</label>
              <select id="card-state" class="form-select">
                <option value="todo">Por hacer</option>
                <option value="grabando">Grabando</option>
                <option value="listo">Listo</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="card-sede">Sede / Locación</label>
            <input type="text" id="card-sede" class="form-input" placeholder="Ej: Terraza, Cocina, Sede Norte...">
          </div>

          <div class="form-group">
            <label class="form-label" for="card-desc">Guión / Indicaciones de rodaje</label>
            <textarea id="card-desc" class="form-textarea" placeholder="Escribe el concepto, guión, planos clave o indicaciones..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="card-subtasks-input">Subtareas de rodaje (una por línea)</label>
            <textarea id="card-subtasks-input" class="form-textarea" style="min-height:75px;" placeholder="Plano de entrada al plato&#10;Reacción de cliente&#10;Cierre con logo..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="card-links-input">Enlaces de referencia (URL o Título | URL, uno por línea)</label>
            <textarea id="card-links-input" class="form-textarea" style="min-height:65px;" placeholder="https://instagram.com/reel/...&#10;Referencia visual | https://drive.google.com/..."></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn-primary">Guardar tarjeta</button>
        </div>
      </form>
    </div>
  </div>

  <!-- DATOS DEL TABLERO -->
  <script id="board-data">
    const DATA = {
      "fecha": "",
      "cliente": "",
      "contenidos": []
    };
    window.DATA = DATA;
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('../sw.js').catch(function(e) { console.warn('SW:', e); });
      });
    }
  </script>
</body>
</html>
