<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel de tableros · Nexo</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--azul:#1F3549;--azul-2:#2B4661;--azul-soft:#E6EBF0;--verde:#5CB83E;--verde-dk:#3F8A27;--verde-soft:#EAF6E4;--naranja:#E64A00;--naranja-soft:#FCEBE2;--gris:#979797;--bg:#EEF1F4;--ink:#1F3549;--ink-2:#5B6B7A;--line:#E1E6EB}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Futura','Jost','Century Gothic',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
.shell{max-width:1100px;margin:0 auto;padding:0 16px}
header{background:#fff;padding:16px 0}
header .shell{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo svg{height:64px;width:auto;display:block}
header h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500;text-align:right}
header h1 b{display:block;font-size:20px;letter-spacing:-.01em;text-transform:none;color:var(--ink)}
.hero{background:var(--azul);color:#fff;padding:28px 0 80px;border-radius:30px 30px 0 0}
.hero .shell{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.hero h2{font-size:clamp(28px,5vw,48px);line-height:1;letter-spacing:-.03em}
.hero h2 span{color:transparent;-webkit-text-stroke:1.2px #fff}
.hero p{color:#B9C6D2;font-size:14px;margin-top:8px}
.btn{border:0;border-radius:99px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--verde);color:#fff}
.btn.sec{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-52px}
.stat{background:#fff;border-radius:20px;padding:16px 18px;box-shadow:0 20px 40px -24px rgba(31,53,73,.3);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,outline .15s ease}
.stat:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px rgba(31,53,73,.2)}
.stat.on{outline:2px solid var(--azul);box-shadow:0 10px 24px -10px rgba(31,53,73,.25)}
.stat b{display:block;font-size:28px;line-height:1.1}
.stat span{font-size:12.5px;color:var(--ink-2)}
.stat.ok b{color:var(--verde-dk)} .stat.fix b{color:var(--naranja)}
.btn-tag{border:0;background:none;font-size:13px;color:var(--ink-2);font-weight:600;cursor:pointer;padding:2px 8px;border-radius:99px;transition:background .15s;text-align:left;display:inline-flex;align-items:center;gap:4px}
.btn-tag:hover{background:var(--bg)}
.btn-tag.ok{color:var(--verde-dk);background:var(--verde-soft)}
.btn-tag.fix{color:var(--naranja);background:var(--naranja-soft)}
.det-tools{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--ink-2)}
.det-chip{border:0;background:var(--bg);font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;cursor:pointer;color:var(--ink-2)}
.det-chip.on{background:var(--azul);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:26px 0 14px}
.chip{border:0;background:#fff;color:var(--ink-2);font-size:13px;font-weight:500;padding:8px 14px;border-radius:99px;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
.chip.on{background:var(--azul);color:#fff;box-shadow:none}
.search{margin-left:auto;border:0;border-radius:99px;padding:9px 16px;box-shadow:inset 0 0 0 1px var(--line);background:#fff;min-width:200px}
.list{display:grid;gap:12px;padding-bottom:60px}
.row{background:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 1px 0 var(--line);position:relative;overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.row[data-e="Aprobado"]::before{background:var(--verde)} .row[data-e="Con cambios"]::before{background:var(--naranja)} .row[data-e="Parcial"]::before{background:#8FA3B6}
.r-top{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.r-top h3{font-size:18px;line-height:1.2}
.r-top small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
.badge{font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--bg);color:var(--ink-2);white-space:nowrap}
.row[data-e="Aprobado"] .badge{background:var(--verde-soft);color:var(--verde-dk)}
.row[data-e="Con cambios"] .badge{background:var(--naranja-soft);color:var(--naranja)}
.bar{display:flex;height:8px;border-radius:99px;background:var(--azul-soft);overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%} .bar .a{background:var(--verde)} .bar .c{background:var(--naranja)}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.meta a{color:var(--azul);font-weight:600;text-decoration:none}
.meta button{border:0;background:none;color:var(--azul);font-weight:600;cursor:pointer;padding:0}
.det{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.row.open .det{display:grid;gap:8px}
.it{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;font-size:14px}
.it .n{font-weight:700;color:var(--ink-2)}
.it .c{color:var(--ink-2);font-size:13px;margin-top:2px;white-space:pre-line}
.it .fc{color:var(--naranja);font-size:12.5px;font-weight:600}
.pill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--bg);color:var(--ink-2);white-space:nowrap}
.pill.aprobado{background:var(--verde-soft);color:var(--verde-dk)} .pill.cambios{background:var(--naranja-soft);color:var(--naranja)}
.empty,.msg{background:#fff;border-radius:22px;padding:30px;text-align:center;color:var(--ink-2)}
.login{max-width:420px;margin:30px auto;background:#fff;border-radius:24px;padding:26px;box-shadow:0 20px 40px -24px rgba(31,53,73,.3)}
.login h3{font-size:20px} .login p{color:var(--ink-2);font-size:14px;margin:6px 0 14px}
.login input{width:100%;border:0;border-radius:14px;padding:12px 14px;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:12px}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.search{margin-left:0;width:100%}.logo svg{height:48px}}
</style>
</head>
<body>

0 22 27 0 28 0 9 -22 9 -22 10 0 c8 0 9 0 9 2 -1 3 -64 147 -65 147 0 0 -15 -33 -33 -74z m44 10 c5 -13 10 -24 10 -24 0 -1 -9 -1 -21 -1 -12 0 -21 0 -21 1 0 1 20 48 21 48 0 0 5 -11 11 -24z M952 844 c-36 -6 -58 -35 -58 -75 0 -36 18 -61 49 -71 12 -4 38 -4 50 0 27 10 43 32 45 64 l0 11 -30 0 -30 0 0 -8 0 -8 21 0 20 0 -1 -4 c-5 -34 -42 -52 -75 -36 -38 18 -41 80 -4 104 15 10 39 10 55 1 5 -2 15 -12 18 -17 l2 -2 7 5 c4 3 7 7 7 8 0 3 -16 17 -24 21 -14 7 -35 10 -52 7z M1338 843 c-25 -6 -45 -25 -53 -48 -3 -12 -4 -32 -1 -44 12 -50 70 -72 115 -44 l6 3 0 12 0 12 -7 -6 c-24 -23 -58 -22 -81 0 -12 13 -16 24 -16 42 0 51 59 77 96 43 4 -3 7 -6 7 -6 1 0 1 5 1 11 l0 12 -6 3 c-18 11 -41 15 -61 10z M1051 770 l0 -72 38 0 39 1 0 8 0 8 -29 0 -30 0 0 27 0 27 30 0 29 0 0 8 0 8 -29 0 -30 0 0 20 0 20 30 0 29 0 0 9 0 8 -38 0 -39 0 0 -72z M1422 770 l0 -72 9 0 9 0 0 72 0 72 -9 0 -9 0 0 -72z M825 688 c-33 -5 -57 -31 -61 -65 -6 -61 47 -101 104 -78 l6 2 0 22 c0 11 0 21 -1 21 0 0 -3 -3 -7 -6 -29 -25 -68 -2 -62 36 3 21 16 33 36 33 12 0 16 -2 28 -12 l6 -5 0 22 0 22 -7 2 c-13 6 -29 8 -42 6z M1128 687 c-21 -7 -32 -25 -32 -52 0 -25 8 -42 25 -50 6 -3 7 -3 18 -3 16 0 22 2 30 11 l6 6 0 -7 0 -7 17 0 16 0 0 50 0 50 -16 0 -17 0 0 -7 0 -7 -3 3 c-4 5 -8 8 -13 11 -6 3 -25 4 -31 2z m37 -30 c14 -7 15 -34 2 -42 -13 -9 -30 -4 -34 11 -7 23 12 41 32 31z M883 614 l0 -72 19 0 19 0 0 27 0 26 16 -26 15 -27 23 0 c12 0 22 0 22 0 0 1 -9 14 -19 29 -21 30 -20 29 -17 29 7 0 20 10 25 20 3 7 3 7 3 20 0 18 -4 28 -16 37 -11 7 -14 7 -54 8 l-36 0 0 -71z m60 37 c7 -4 10 -15 6 -23 -3 -7 -8 -9 -19 -10 l-9 0 0 18 0 18 9 0 c7 0 10 -1 13 -3z M1000 614 l0 -72 44 0 44 0 0 17 0 16 -25 0 -25 0 0 12 0 11 24 0 23 0 0 16 0 15 -23 0 -24 0 0 12 0 12 25 0 25 0 0 16 0 16 -44 0 -44 0 0 -71z M1220 631 l0 -55 -23 0 -23 0 0 -17 1 -16 58 -1 59 0 0 17 0 17 -16 0 -16 0 0 55 0 54 -20 0 -20 0 0 -54z M1302 614 l0 -72 20 0 20 0 0 72 0 71 -20 0 -20 0 0 -71z M1349 685 c0 0 13 -32 30 -71 l30 -71 15 -1 16 0 29 70 c16 38 29 70 30 71 0 2 -1 2 -21 2 l-21 0 -16 -42 c-9 -22 -17 -41 -17 -41 0 0 -8 19 -16 42 l-16 41 -22 0 c-11 0 -21 0 -21 0z M1510 684 c-1 -1 -14 -33 -30 -71 -16 -38 -29 -70 -29 -70 0 -1 9 -1 21 -1 l21 0 2 5 c1 3 8 21 16 41 7 19 14 35 14 36 0 2 6 -11 17 -40 l16 -42 22 0 21 0 -4 9 c-2 5 -16 37 -30 72 l-26 62 -15 0 c-12 0 -16 0 -16 -1z"/></g></svg></div><h1>Panel interno<b>Tableros de contenido</b></h1></div></header>
<section class="hero"><div class="shell">
  <div><h2>Estado de <span>aprobaciones</span></h2><p id="upd">Cargando…</p></div>
  <div style="display:flex;gap:8px"><button class="btn sec" id="out">Cerrar sesión</button><button class="btn" id="reload">↻ Actualizar</button></div>
</div></section>
<main class="shell">
  <div id="app"></div>
</main>
<script>
(function(){
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbyLYC8p_iglMhPuXMaPRZ4TOA_2fPTRCe3V2EmVnwotm2v5vll39e7X2AuBC-9eNcp7Jg/exec';
  var KEY = 'nexo-panel-clave', clave = '';
  try { clave = localStorage.getItem(KEY) || ''; } catch (e) {}
  var app = document.getElementById('app'), f = 'Todos', q = '', DB = null;
  function el(t, c, x){ var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function fecha(s){ if (!s) return ''; var d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleDateString('es-VE', {day:'2-digit', month:'short'}) + ' ' + d.toLocaleTimeString('es-VE', {hour:'2-digit', minute:'2-digit'}); }

  function login(msg){
    app.innerHTML = '';
    var b = el('div', 'login'); b.appendChild(el('h3', null, 'Acceso al panel'));
    b.appendChild(el('p', null, msg || 'Escribe la clave del panel de Nexo. Se guarda en este navegador.'));
    var i = el('input'); i.type = 'password'; i.placeholder = 'Clave'; b.appendChild(i);
    var go = el('button', 'btn', 'Entrar'); b.appendChild(go);
    go.onclick = function(){ clave = i.value.trim(); try { localStorage.setItem(KEY, clave); } catch (e) {} load(); };
    i.onkeydown = function(e){ if (e.key === 'Enter') go.click(); };
    app.appendChild(b); document.getElementById('upd').textContent = 'Sin sesión';
  }

  function load(){
    if (!clave) return login();
    document.getElementById('upd').textContent = 'Cargando…';
    fetch(ENDPOINT + '?clave=' + encodeURIComponent(clave) + '&t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(j){
        if (!j.ok) { try { localStorage.removeItem(KEY); } catch (e) {} clave = ''; return login('Clave incorrecta. Inténtalo de nuevo.'); }
        DB = j; render(); document.getElementById('upd').textContent = 'Actualizado ' + fecha(new Date().toISOString());
      })
      .catch(function(){ app.innerHTML = ''; app.appendChild(el('div', 'msg', 'No se pudo conectar con la hoja de Google. Revisa tu conexión y toca Actualizar.')); });
  }

  function matchesFilter(t, filter){
    if (!filter || filter === 'Todos') return true;
    var a = +t.aprobados || 0, c = +t.cambios || 0;
    if (filter === 'Aprobados' || filter === 'Aprobado') return a > 0 || t.estado === 'Aprobado';
    if (filter === 'Con cambios') return c > 0 || t.estado === 'Con cambios';
    if (filter === 'Parcial') return t.estado === 'Parcial';
    if (filter === 'Sin respuesta') return t.estado === 'Sin respuesta' || (!t.estado && !a && !c);
    return t.estado === filter;
  }

  function render(){
    app.innerHTML = '';
    var T = (DB.tableros || []).slice().sort(function(a, b){ return String(b.ultimaRevision || b.registrado).localeCompare(String(a.ultimaRevision || a.registrado)); });
    var cnt = {total:T.length, sin:0, fix:0, ok:0};
    T.forEach(function(t){
      var a = +t.aprobados || 0, c = +t.cambios || 0;
      if (t.estado === 'Sin respuesta' || (!t.estado && !a && !c)) cnt.sin++;
      if (c > 0 || t.estado === 'Con cambios') cnt.fix++;
      if (a > 0 || t.estado === 'Aprobado') cnt.ok++;
    });
    var st = el('section', 'stats');
    [['Tableros', cnt.total, '', 'Todos'], ['Sin respuesta', cnt.sin, '', 'Sin respuesta'], ['Con cambios', cnt.fix, 'fix', 'Con cambios'], ['Aprobados', cnt.ok, 'ok', 'Aprobados']].forEach(function(x){
      var d = el('div', 'stat ' + x[2] + (f === x[3] ? ' on' : ''));
      d.appendChild(el('b', null, x[1]));
      d.appendChild(el('span', null, x[0]));
      d.title = 'Filtrar por ' + x[0];
      d.onclick = function(){ f = (f === x[3] && f !== 'Todos') ? 'Todos' : x[3]; render(); };
      st.appendChild(d);
    });
    app.appendChild(st);

    var tools = el('div', 'tools');
    ['Todos', 'Aprobados', 'Con cambios', 'Parcial', 'Sin respuesta'].forEach(function(n){
      var c = el('button', 'chip' + (f === n ? ' on' : ''), n);
      c.onclick = function(){ f = n; render(); };
      tools.appendChild(c);
    });
    var s = el('input', 'search'); s.placeholder = 'Buscar cliente…'; s.value = q; s.oninput = function(){ q = s.value; draw(); }; tools.appendChild(s);
    app.appendChild(tools);
    var list = el('div', 'list'); app.appendChild(list);

    function draw(){
      list.innerHTML = '';
      var rows = T.filter(function(t){ return matchesFilter(t, f) && (!q || String(t.cliente).toLowerCase().indexOf(q.toLowerCase()) >= 0); });
      if (!rows.length) { list.appendChild(el('div', 'empty', T.length ? 'No hay tableros en este filtro.' : 'Aún no hay tableros registrados.')); return; }
      rows.forEach(function(t){
        var e = t.estado || 'Sin respuesta', tot = +t.total || 0, a = +t.aprobados || 0, c = +t.cambios || 0;
        var r = el('article', 'row'); r.dataset.e = e;
        var top = el('div', 'r-top'); var h = el('div'); h.appendChild(el('h3', null, t.cliente + ' · ' + t.mes + ' ' + t.anio));
        h.appendChild(el('small', null, tot + ' contenidos' + (t.revisadoPor ? ' · revisó ' + t.revisadoPor : ''))); top.appendChild(h); top.appendChild(el('span', 'badge', e)); r.appendChild(top);
        var bar = el('div', 'bar'); var ia = el('i', 'a'); ia.style.width = (tot ? a / tot * 100 : 0) + '%'; var ic = el('i', 'c'); ic.style.width = (tot ? c / tot * 100 : 0) + '%'; bar.appendChild(ia); bar.appendChild(ic); r.appendChild(bar);
        var m = el('div', 'meta');
        
        var det = (DB.detalle || []).filter(function(d){ return String(d.id) === String(t.id); }).sort(function(x, y){ return x.n - y.n; });
        var detFilter = 'Todos';

        var bOk = el('button', 'btn-tag ok', '✓ ' + a + ' aprobados');
        var bFix = el('button', 'btn-tag fix', '✎ ' + c + ' con cambios');
        var bPend = el('button', 'btn-tag', '• ' + (tot - a - c) + ' pendientes');
        m.appendChild(bOk); m.appendChild(bFix); m.appendChild(bPend);

        if (t.ultimaRevision) m.appendChild(el('span', null, 'Última respuesta: ' + fecha(t.ultimaRevision))); else if (t.registrado) m.appendChild(el('span', null, 'Enviado: ' + fecha(t.registrado)));
        if (t.url) { var l = el('a', null, 'Abrir tablero ↗'); l.href = t.url; l.target = '_blank'; l.rel = 'noopener'; m.appendChild(l); }
        
        var tg = null;
        if (det.length) {
          tg = el('button', null, 'Ver respuestas');
          tg.onclick = function(){
            detFilter = 'Todos';
            r.classList.toggle('open');
            tg.textContent = r.classList.contains('open') ? 'Ocultar respuestas' : 'Ver respuestas';
            renderDet();
          };
          m.appendChild(tg);
        }
        r.appendChild(m);

        var dv = el('div', 'det');
        function renderDet(){
          dv.innerHTML = '';
          if (!det.length) return;
          var dt = el('div', 'det-tools');
          dt.appendChild(el('span', null, 'Filtrar respuestas:'));
          ['Todos', 'Aprobados', 'Con cambios', 'Pendientes'].forEach(function(df){
            var dc = el('button', 'det-chip' + (detFilter === df ? ' on' : ''), df);
            dc.onclick = function(ev){
              ev.stopPropagation();
              detFilter = df;
              renderDet();
            };
            dt.appendChild(dc);
          });
          dv.appendChild(dt);
          var filtered = det.filter(function(d){
            if (detFilter === 'Aprobados') return d.estado === 'aprobado';
            if (detFilter === 'Con cambios') return d.estado === 'cambios';
            if (detFilter === 'Pendientes') return d.estado === 'pendiente' || !d.estado;
            return true;
          });
          if (!filtered.length) {
            dv.appendChild(el('div', 'empty', 'No hay contenidos con este estado (' + detFilter + ').'));
            return;
          }
          filtered.forEach(function(d){
            var it = el('div', 'it'); it.appendChild(el('span', 'n', (d.n < 10 ? '0' : '') + d.n));
            var mid = el('div'); mid.appendChild(el('div', null, d.titulo));
            if (d.formato && d.formatoOriginal && d.formato !== d.formatoOriginal) mid.appendChild(el('div', 'fc', 'Formato: ' + d.formatoOriginal + ' → ' + d.formato));
            if (d.comentario) mid.appendChild(el('div', 'c', '“' + d.comentario + '”'));
            it.appendChild(mid); it.appendChild(el('span', 'pill ' + d.estado, d.estado === 'aprobado' ? 'Aprobado' : d.estado === 'cambios' ? 'Cambios' : 'Pendiente'));
            dv.appendChild(it);
          });
        }

        bOk.onclick = function(){
          detFilter = 'Aprobados';
          r.classList.add('open');
          if (tg) tg.textContent = 'Ocultar respuestas';
          renderDet();
        };
        bFix.onclick = function(){
          detFilter = 'Con cambios';
          r.classList.add('open');
          if (tg) tg.textContent = 'Ocultar respuestas';
          renderDet();
        };
        bPend.onclick = function(){
          detFilter = 'Pendientes';
          r.classList.add('open');
          if (tg) tg.textContent = 'Ocultar respuestas';
          renderDet();
        };

        renderDet();
        r.appendChild(dv); list.appendChild(r);
      });
    }
    draw();
  }

  document.getElementById('reload').onclick = load;
  document.getElementById('out').onclick = function(){ try { localStorage.removeItem(KEY); } catch (e) {} clave = ''; login(); };
  if (ENDPOINT.indexOf('__') === 0) { app.appendChild(el('div', 'msg', 'Falta configurar la dirección de la hoja de Google (ENDPOINT).')); document.getElementById('upd').textContent = 'Sin configurar'; }
  else load();
})();
</script>
