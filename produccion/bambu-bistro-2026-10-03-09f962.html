<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Tablero NEXO</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%22540%20610%201300%201160%22%3E%3Cg%20transform%3D%22translate(0%2C2364)%20scale(1%2C-1)%22%3E%3Cpath%20fill%3D%22%235CB83E%22%20d%3D%22M1266%201638%20c-67%20-59%20-123%20-108%20-123%20-108%200%20-1%20129%20-214%20131%20-216%201%20-1%202%204%2018%2065%20l17%2064%20116%200%20115%200%200%20-3%20c-1%20-1%20-43%20-157%20-94%20-347%20-51%20-189%20-93%20-344%20-93%20-345%200%200%2051%200%20114%200%20l113%201%2014%2051%20c8%2028%2051%20188%2096%20355%20109%20402%20124%20459%20124%20460%200%201%20-62%201%20-229%201%20-218%200%20-229%200%20-229%202%201%202%2034%20127%2034%20128%200%201%20-17%20-13%20-124%20-108z%20M759%201528%20c-147%20-548%20-209%20-778%20-209%20-779%200%20-1%2073%20-1%20229%20-1%20125%200%20228%200%20228%200%200%200%20-8%20-30%20-17%20-65%20-9%20-35%20-17%20-65%20-16%20-65%200%200%201%201%203%202%201%202%2056%2050%20122%20107%2066%2058%20120%20106%20120%20106%201%201%20-18%2034%20-63%20108%20-75%20123%20-67%20110%20-67%20109%20-1%200%20-9%20-29%20-18%20-65%20l-17%20-64%20-115%200%20-115%200%200%203%20c1%202%20184%20687%20186%20690%200%202%20-6%202%20-114%202%20l-114%200%20-23%20-88z%22%3E%3C%2Fpath%3E%3C%2Fg%3E%3C%2Fsvg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <!-- Firebase SDK compat -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --nexo-blue: #1F3549;
      --nexo-green: #5CB83E;
      --bg-color: #F5F5F7;
      --surface: #FFFFFF;
      --text-main: #1D1D1F;
      --text-muted: #86868B;
      --border-color: rgba(0,0,0,0.06);
      --shadow-float: 0 10px 40px -10px rgba(0,0,0,0.08);
      --shadow-card: 0 4px 20px -4px rgba(0,0,0,0.05);
      --font-sans: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg-color);
      font-family: var(--font-sans);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0;
      width: 100%;
    }

    .header-island {
      margin: 24px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 32px;
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      align-content: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: var(--shadow-float);
      border: 1px solid rgba(255, 255, 255, 0.4);
      z-index: 100;
      flex-shrink: 0;
    }

    .island-left { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    .logo-badge {
      background: var(--nexo-blue);
      color: #fff;
      font-weight: 800;
      letter-spacing: 1px;
      font-size: 14px;
      width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(31,53,73,0.3);
      flex-shrink: 0;
    }
    .island-titles h1 { font-size: 20px; font-weight: 700; color: var(--nexo-blue); letter-spacing: -0.5px; margin: 0; line-height: 1.2; }
    .island-titles p { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin: 2px 0 0 0; }

    .island-center { flex: 1 1 200px; display: flex; justify-content: center; align-items: center; }
    .modern-search {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.04);
      padding: 0 20px;
      border-radius: 99px;
      width: 100%;
      max-width: 380px;
      height: 44px;
      border: 1px solid transparent;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    .modern-search:focus-within {
      background: #fff;
      border-color: var(--nexo-green);
      box-shadow: 0 0 0 4px rgba(92,184,62,0.15);
    }
    .modern-search i, .modern-search svg { color: var(--text-muted); width: 18px; height: 18px; flex-shrink: 0; }
    .modern-search input {
      border: none; background: transparent; outline: none; width: 100%;
      font-family: inherit; font-size: 14px; color: var(--text-main); font-weight: 500;
      height: 100%;
    }

    .island-right { display: flex; align-items: center; gap: 20px; flex-shrink: 0; }
    .global-progress { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; justify-content: center;}
    .gp-text { display: flex; gap: 8px; align-items: baseline; }
    .gp-text span:first-child { font-size: 22px; font-weight: 800; color: var(--nexo-green); letter-spacing: -1px;}
    .gp-text span:last-child { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;}
    .gp-bar-container { width: 120px; height: 6px; background: rgba(0,0,0,0.06); border-radius: 99px; overflow: hidden; }
    .gp-bar-fill { height: 100%; background: var(--nexo-green); border-radius: 99px; transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1); }

    .live-indicator-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-right: 6px;
      letter-spacing: 0.2px;
      user-select: none;
    }
    .live-indicator-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9ca3af;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }
    .live-indicator-pill.online {
      color: var(--nexo-green);
    }
    .live-indicator-pill.online .live-indicator-dot {
      background: var(--nexo-green);
      box-shadow: 0 0 6px rgba(92,184,62,0.6);
    }

    .btn-icon-subtle {
      background: transparent; border: none; color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%;
      transition: all 0.2s ease; flex-shrink: 0;
    }
    .btn-icon-subtle:hover { background: rgba(0,0,0,0.05); color: var(--nexo-blue); }

    .btn-action-primary {
      background: var(--nexo-blue);
      color: #fff; border: none; border-radius: 99px;
      padding: 0 24px; height: 44px; font-family: inherit; font-size: 14px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 12px rgba(31,53,73,0.2);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      flex-shrink: 0;
    }
    .btn-action-primary:hover {
      transform: translateY(-2px); box-shadow: 0 8px 20px rgba(31,53,73,0.3); background: #162635;
    }

    .kanban-canvas {
      flex: 1; padding: 0 24px 24px 24px;
      display: flex; gap: 24px; overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
      overscroll-behavior-x: contain;
      will-change: scroll-position;
    }
    .kanban-canvas::-webkit-scrollbar { height: 0px; }
    
    .k-col {
      flex: 1; min-width: 320px; max-width: 400px;
      display: flex; flex-direction: column;
    }
    
    .k-col-header {
      padding: 8px 0 24px 0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .k-col-title {
      font-size: 18px; font-weight: 800; color: var(--text-main);
      display: flex; align-items: center; gap: 8px; letter-spacing: -0.5px;
    }
    .k-col-title i { color: var(--text-muted); }
    .k-col-count {
      background: rgba(0,0,0,0.05); color: var(--text-main); font-weight: 700;
      padding: 4px 12px; border-radius: 99px; font-size: 13px;
    }

    .k-col-cards {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-bottom: 24px;
      min-height: 200px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    .k-col-cards::-webkit-scrollbar { width: 0px; }

    .card {
      background: var(--surface);
      border-radius: 24px;
      padding: 20px;
      cursor: grab;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(0,0,0,0.03);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .card:active { cursor: grabbing; transform: scale(0.98); }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-float); }
    .card.grabando { border: 2px solid #F97316; box-shadow: 0 10px 30px rgba(249,115,22,0.15); }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .card-type-badge {
      font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 8px;
      text-transform: uppercase; letter-spacing: 0.5px; color: #fff;
    }
    .card-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s; }
    .card:hover .card-actions { opacity: 1; }
    @media (hover: none) { .card-actions { opacity: 1; } }
    .btn-micro { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 6px; }
    .btn-micro:hover { background: var(--bg-color); color: var(--nexo-blue); }

    .card-title { font-size: 16px; font-weight: 700; color: var(--text-main); line-height: 1.3; margin-bottom: 6px; }
    .card-desc { font-size: 13px; color: var(--text-muted); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 16px;}
    
    .card-sede-pill {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--bg-color); color: var(--text-muted);
      padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; margin-bottom: 16px;
    }
    .card-sede-pill i { width: 12px; height: 12px; color: var(--nexo-green); }

    .checklist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .check-item { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; position: relative;}
    .check-item input[type="checkbox"] { 
      appearance: none; -webkit-appearance: none; 
      width: 18px; height: 18px; min-width: 18px;
      border: 2px solid var(--border-color); border-radius: 6px;
      margin: 2px 0 0 0; cursor: pointer; transition: all 0.2s;
      position: relative;
    }
    .check-item input[type="checkbox"]:checked { background: var(--nexo-green); border-color: var(--nexo-green); }
    .check-item input[type="checkbox"]:checked::after {
      content: ''; position: absolute; left: 5px; top: 1px;
      width: 4px; height: 9px; border: solid white; border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .check-item span { font-size: 13px; color: var(--text-main); line-height: 1.4; font-weight: 500; transition: color 0.2s; }
    .check-item input[type="checkbox"]:checked + span { text-decoration: line-through; color: var(--text-muted); }

    .c-prog { display: flex; align-items: center; gap: 12px; margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border-color); }
    .c-prog-bar { flex: 1; height: 6px; background: var(--bg-color); border-radius: 99px; overflow: hidden; }
    .c-prog-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; }
    .c-prog-text { font-size: 12px; font-weight: 700; color: var(--text-muted); }

    .sortable-ghost { opacity: 0.3; background: var(--border-color); border-radius: 24px; border: 2px dashed var(--nexo-blue); }

    .modal-overlay { 
      position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; 
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal-sheet {
      background: #fff; border-radius: 32px; width: 90%; max-width: 560px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      transform: translateY(40px) scale(0.95); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; flex-direction: column; max-height: 90vh;
    }
    .modal-overlay.show .modal-sheet { transform: translateY(0) scale(1); }
    
    .m-header { padding: 24px 32px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .m-header h2 { font-size: 22px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px;}
    .m-body { padding: 32px; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
    .m-footer { padding: 20px 32px; background: var(--bg-color); border-top: 1px solid var(--border-color); border-radius: 0 0 32px 32px; display: flex; justify-content: flex-end; gap: 12px; }
    
    .input-grp { display: flex; flex-direction: column; gap: 8px; }
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .input-grp label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .huge-input {
      border: none; border-bottom: 2px solid var(--border-color); border-radius: 0;
      font-size: 24px; font-weight: 700; color: var(--text-main); font-family: inherit;
      padding: 8px 0; outline: none; transition: border-color 0.2s;
    }
    .huge-input:focus { border-color: var(--nexo-blue); }
    
    .std-input {
      background: var(--bg-color); border: 1px solid transparent; border-radius: 12px;
      padding: 12px 16px; font-size: 14px; font-weight: 500; font-family: inherit;
      color: var(--text-main); outline: none; transition: all 0.2s;
    }
    .std-input:focus { background: #fff; border-color: var(--nexo-green); box-shadow: 0 0 0 4px rgba(92,184,62,0.1); }
    
    select.std-input { appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2386868B%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; }

    .subtask-editor-list { display: flex; flex-direction: column; gap: 8px; }
    .subtask-editor-item { display: flex; gap: 8px; align-items: center; }
    .btn-secondary { background: #fff; border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 24px; border-radius: 99px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .btn-secondary:hover { background: var(--bg-color); }
    .btn-block { width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 8px; }

    @media (hover: none) {
      .card:hover { transform: none; box-shadow: var(--shadow-card); }
    }

    /* RESPONSIVE MOBILE */
    @media (max-width: 768px) {
      .header-island {
        margin: 12px;
        padding: 16px;
        border-radius: 24px;
        flex-direction: column;
        align-items: stretch;
      }
      .island-left { justify-content: space-between; }
      .island-center { flex: 1 1 auto; }
      .modern-search { max-width: 100%; }
      .island-right { justify-content: space-between; flex-wrap: wrap; }
      .global-progress { align-items: flex-start; }
      .btn-action-primary { flex: 1; justify-content: center; }
      
      .kanban-canvas {
        padding: 0 16px 80px 16px;
        scroll-snap-type: x proximity;
        scroll-padding: 0 16px;
        scroll-behavior: smooth;
        gap: 16px;
      }
      .k-col {
        min-width: 82vw;
        max-width: none;
        scroll-snap-align: center;
        will-change: transform;
      }
      
      .modal-sheet {
        height: 100vh;
        max-height: 100vh;
        width: 100%;
        max-width: 100%;
        border-radius: 0;
      }
      .input-row { grid-template-columns: 1fr; }
    }

    /* REFERENCES */
    .card-ref-block { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.02); padding: 8px 12px; border-radius: 12px; margin-bottom: 16px; }
    .card-ref-info { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: var(--text-main); }
    .card-ref-info i { color: var(--nexo-blue); }
    
    .ref-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .ref-item { display: flex; align-items: center; justify-content: space-between; background: var(--bg-color); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); }
    .ref-info { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--text-main); overflow: hidden; }
    .ref-info span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
    
    .media-sheet { max-width: 900px !important; width: 95% !important; max-height: 95vh !important; height: 95vh; display: flex; flex-direction: column; }
    .media-body { flex: 1; padding: 0 !important; background: #000; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden !important; border-radius: 0; }
    .media-body iframe, .media-body video, .media-body img { width: 100%; height: 100%; object-fit: contain; border: none; }
    .media-footer { padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .nav-refs { display: flex; align-items: center; gap: 16px; font-size: 14px; font-weight: 700; color: var(--text-main); }
    .nav-refs button { background: var(--bg-color); border: none; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; color: var(--text-main); }
    .nav-refs button:hover:not(:disabled) { background: rgba(0,0,0,0.1); }
    .nav-refs button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .media-warning {
      position: absolute; top: 16px; left: 16px; right: 16px;
      background: rgba(0,0,0,0.75); color: #fff; padding: 12px 16px;
      border-radius: 12px; font-size: 13px; display: flex; gap: 12px; align-items: flex-start;
      z-index: 10; pointer-events: none; backdrop-filter: blur(8px);
    }

    /* VIEW MODAL */
    .view-desc {
      background: var(--bg-color); border-radius: 12px; padding: 16px;
      font-size: 14px; line-height: 1.75; color: var(--text-main);
      white-space: pre-wrap; max-height: 320px; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .btn-grabando {
      background: #F97316; color: #fff; border: none; border-radius: 99px;
      padding: 0 24px; height: 44px; font-family: inherit; font-size: 14px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 12px rgba(249,115,22,0.3);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); flex-shrink: 0;
    }
    .btn-grabando:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(249,115,22,0.4); background: #ea6c0a; }
    .btn-listo {
      background: var(--nexo-green); color: #fff; border: none; border-radius: 99px;
      padding: 0 24px; height: 44px; font-family: inherit; font-size: 14px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 4px 12px rgba(92,184,62,0.3);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); flex-shrink: 0;
    }
    .btn-listo:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(92,184,62,0.4); background: #4da632; }
  </style>
</head>
<body>

  <header class="header-island">
    <div class="island-left">
      <div class="logo-badge">NEXO</div>
      <div class="island-titles">
        <h1 id="hdr-client">Tablero de Producción</h1>
        <p id="hdr-date">Esperando tareas...</p>
      </div>
    </div>
    <div class="island-center">
      <div class="modern-search">
        <i data-lucide="search"></i>
        <input type="text" id="search-input" placeholder="Buscar tarjetas o referencias...">
      </div>
    </div>
    <div class="island-right">

    function escapeHTML(str) {
      if (typeof str !== 'string') return '';
      return str.replace(/[&<>'"]/g, tag => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[tag]));
    }

    function detectMediaPlatform(urlStr) {
      try {
        const u = new URL(urlStr);
        if (!['http:', 'https:'].includes(u.protocol)) return null;
        const host = u.hostname.toLowerCase();
        if (host.includes('youtube.com') || host.includes('youtu.be')) return 'youtube';
        if (host.includes('instagram.com')) return 'instagram';
        if (host.includes('tiktok.com')) return 'tiktok';
        if (host.includes('facebook.com') || host.includes('fb.watch')) return 'facebook';
        if (host.includes('vimeo.com')) return 'vimeo';
        const ext = u.pathname.split('.').pop().toLowerCase().split('?')[0];
        if (['mp4','webm','mov'].includes(ext)) return 'video';
        if (['mp3','wav','ogg'].includes(ext)) return 'audio';
        if (['jpg','jpeg','png','webp','gif'].includes(ext)) return 'image';
        return 'external';
      } catch(e) { return null; }
    }

    function getPlatformIcon(platform) {
      const icons = {'youtube':'youtube','instagram':'instagram','tiktok':'music','facebook':'facebook','vimeo':'video','video':'film','audio':'headphones','image':'image','external':'link'};
      return icons[platform] || 'link';
    }

    const TIPOS = {
      "video":    {label:"Video", g1:"#F97316"},
      "carrusel": {label:"Carrusel", g1:"#3B82F6"},
      "foto":     {label:"Foto", g1:"#10B981"},

      "story":    {label:"Story", g1:"#8B5CF6"},
      "otro":     {label:"Otro", g1:"#64748B"}
    };

    const LS_KEY = 'nexo-tablero-' + (DATA.fecha || 'v3') + '-' + (DATA.cliente || '').toLowerCase().replace(/[^a-z0-9]/g, '-');
    let state = { fecha: '', cliente: '', contenidos: [] };
    let searchQuery = '';
    let db = null;
    let prodDocRef = null;

    function cleanCard(c) {
      if (!c || typeof c !== 'object') return null;
      return {
        id: String(c.id || ''),
        titulo: String(c.titulo || ''),
        tipo: String(c.tipo || 'otro'),
        sede: String(c.sede || ''),
        estado: String(c.estado || 'todo'),
        descripcion: String(c.descripcion || ''),
        subtareas: Array.isArray(c.subtareas) ? c.subtareas.map(s => ({
          id: String(s.id || ''),
          texto: String(s.texto || ''),
          done: !!s.done
        })) : [],
        mediaLinks: Array.isArray(c.mediaLinks) ? c.mediaLinks.map(r => ({
          id: String(r.id || ''),
          url: String(r.url || ''),
          label: String(r.label || ''),
          platform: String(r.platform || 'external')
        })) : []
      };
    }

    function getCounts() {
      let todo = 0, grabando = 0, listo = 0;
      state.contenidos.forEach(c => {
        const st = c.estado || 'todo';
        if (st === 'grabando') grabando++;
        else if (st === 'listo') listo++;
        else todo++;
      });
      return { todo, grabando, listo };
    }

    function updateConnectionStatus(snapshot) {
      const ind = document.getElementById('live-indicator');
      const label = document.getElementById('live-indicator-label');
      if (!ind || !label) return;
      if (!DATA.id || !DATA.firebase) {
        ind.style.display = 'none';
        return;
      }
      ind.style.display = 'inline-flex';
      const isFromCache = snapshot && snapshot.metadata && snapshot.metadata.fromCache;
      const isOnline = navigator.onLine && !isFromCache;
      if (isOnline) {
        ind.className = 'live-indicator-pill online';
        label.textContent = 'En vivo';
      } else {
        ind.className = 'live-indicator-pill offline';
        label.textContent = 'Sin conexi\u00f3n';
      }
    }

    window.addEventListener('online', () => updateConnectionStatus(null));
    window.addEventListener('offline', () => updateConnectionStatus(null));

    function syncToFirestore(cardId, isDelete = false) {
      saveState();
      if (!prodDocRef || typeof firebase === 'undefined') return;
      const counts = getCounts();
      const orden = state.contenidos.map(c => c.id);
      const payload = {
        orden: orden,
        todo: counts.todo,
        grabando: counts.grabando,
        listo: counts.listo,
        actualizado: firebase.firestore.FieldValue.serverTimestamp()
      };
      if (isDelete) {
        payload['tarjetas.' + cardId] = firebase.firestore.FieldValue.delete();
      } else {
        const card = state.contenidos.find(c => c.id === cardId);
        if (card) {
          payload['tarjetas.' + cardId] = {
            id: card.id,
            titulo: card.titulo || '',
            tipo: card.tipo || 'otro',
            sede: card.sede || '',
            estado: card.estado || 'todo',
            descripcion: card.descripcion || '',
            subtareas: Array.isArray(card.subtareas) ? card.subtareas : [],
            mediaLinks: Array.isArray(card.mediaLinks) ? card.mediaLinks : []
          };
        }
      }
      prodDocRef.update(payload).catch(err => {
        console.error('Error sincronizando con Firestore:', err);
      });
    }

    function init() {
      const local = localStorage.getItem(LS_KEY);
      if (local) {
        try {
          const parsed = JSON.parse(local);
          if (parsed.fecha === DATA.fecha && parsed.cliente === DATA.cliente) {
            state = JSON.parse(JSON.stringify(DATA));
            state.contenidos.forEach(card => {
              const saved = (parsed.contenidos || []).find(c => c.id === card.id);
              if (saved) {
                card.estado = saved.estado || card.estado;
                card.subtareas.forEach(sub => {
                  const savedSub = (saved.subtareas || []).find(s => s.id === sub.id);
                  if (savedSub) sub.done = savedSub.done;
                });
              }
            });
            saveState();
          } else {
            state = JSON.parse(JSON.stringify(DATA));
            saveState();
          }
        } catch(e) {
          state = JSON.parse(JSON.stringify(DATA));
          saveState();
        }
      } else {
        state = JSON.parse(JSON.stringify(DATA));
        saveState();
      }

      document.getElementById('hdr-client').textContent = state.cliente || 'Tablero de Producci\u00f3n';
      document.getElementById('hdr-date').textContent = state.fecha || 'Sin fecha asignada';

      const opts = {
        group: 'kanban', animation: 250,
        ghostClass: 'sortable-ghost',
        delay: 200,
        delayOnTouchOnly: true,
        touchStartThreshold: 5,
        onEnd: (evt) => {
          const cardId = evt.item.dataset.id;
          const newStatus = evt.to.dataset.status;
          const card = state.contenidos.find(c => c.id === cardId);
          if (card) {
            if (card.estado !== newStatus) {
              card.estado = newStatus;
              if (newStatus === 'listo') card.subtareas.forEach(s => s.done = true);
              else if (newStatus === 'todo') card.subtareas.forEach(s => s.done = false);
            }
            // Capturar nuevo orden relativo tras soltar tarjeta
            const newOrder = [];
            ['col-todo', 'col-grabando', 'col-listo'].forEach(colId => {
              const col = document.getElementById(colId);
              if (col) {
                col.querySelectorAll('.card').forEach(el => {
                  if (el.dataset.id) newOrder.push(el.dataset.id);
                });
              }
            });
            state.contenidos.sort((a, b) => {
              const ia = newOrder.indexOf(a.id);
              const ib = newOrder.indexOf(b.id);
              return (ia === -1 ? 9999 : ia) - (ib === -1 ? 9999 : ib);
            });
            updateUI();
            syncToFirestore(cardId, false);
          }
        }
      };

      if (typeof Sortable !== 'undefined') {
        new Sortable(document.getElementById('col-todo'), opts);
        new Sortable(document.getElementById('col-grabando'), opts);
        new Sortable(document.getElementById('col-listo'), opts);
      }

      document.getElementById('search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase();
        renderCards();
      });

      document.addEventListener('change', (e) => {
        if (e.target.type === 'checkbox' && e.target.dataset.sid) {
          const cid = e.target.dataset.cid;
          const sid = e.target.dataset.sid;
          const card = state.contenidos.find(c => c.id === cid);
          if (card) {
            const sub = card.subtareas.find(s => s.id === sid);
            if (sub) {
              sub.done = e.target.checked;
              const allDone = card.subtareas.every(s => s.done);
              const someDone = card.subtareas.some(s => s.done);
              if (allDone && card.subtareas.length > 0) card.estado = 'listo';
              else if (someDone && card.estado === 'todo') card.estado = 'grabando';
              else if (!someDone && card.estado === 'listo') card.estado = 'todo';
              updateUI();
              if (currentViewId === cid && document.getElementById('view-modal').classList.contains('show')) {
                updateOpenViewModal(card);
              }
              syncToFirestore(cid, false);
            }
          }
        }
      });

      updateUI();
      initFirebase();
    }

    let isRegisteringProduccion = false;
    function autoRegisterProduccion() {
      if (isRegisteringProduccion || !DATA.id || !prodDocRef || !db) return;
      isRegisteringProduccion = true;
      try {
        const contenidos = Array.isArray(DATA.contenidos) ? DATA.contenidos : [];
        const orden = [];
        const tarjetasMap = {};
        contenidos.forEach((raw) => {
          const c = cleanCard(raw);
          if (c && c.id) {
            c.estado = 'todo';
            orden.push(c.id);
            tarjetasMap[c.id] = c;
          }
        });
        const nowIso = new Date().toISOString();
        const docData = {
          id: String(DATA.id),
          cliente: String(DATA.cliente || ''),
          fecha: String(DATA.fecha || ''),
          url: String(DATA.url || window.location.href.split('?')[0].split('#')[0]),
          registrado: nowIso,
          actualizado: nowIso,
          orden: orden,
          tarjetas: tarjetasMap,
          todo: orden.length,
          grabando: 0,
          listo: 0
        };

        db.runTransaction((transaction) => {
          return transaction.get(prodDocRef).then((sfDoc) => {
            if (!sfDoc.exists) {
              transaction.set(prodDocRef, docData);
            }
          });
        }).then(() => {
          isRegisteringProduccion = false;
          updateConnectionStatus({ metadata: { fromCache: false } });
        }).catch((err) => {
          isRegisteringProduccion = false;
          console.warn('Autorregistro produccion fallback:', err);
        });
      } catch(e) {
        isRegisteringProduccion = false;
      }
    }

    function initFirebase() {
      if (!DATA.id) {
        DATA.id = window.location.pathname.split('/').pop().replace(/\.html$/i, '') || '';
      }
      if (!DATA.firebase) {
        DATA.firebase = {
          apiKey: "AIzaSyAsH9TxW0ld2aNQejJw6xxZW7fpZiw212Q",
          projectId: "nexo-tableros-app"
        };
      }
      if (!DATA.id || !DATA.firebase || !DATA.firebase.projectId || typeof firebase === 'undefined') {
        return;
      }
      try {
        const app = (!firebase.apps || !firebase.apps.length)
          ? firebase.initializeApp(DATA.firebase)
          : firebase.app();
        db = firebase.firestore(app);
        try {
          db.enablePersistence({ synchronizeTabs: true }).catch(err => {
            console.warn('Firestore persistence warning:', err.code);
          });
        } catch(e) {}
        prodDocRef = db.collection('produccion').doc(DATA.id);

        prodDocRef.onSnapshot({ includeMetadataChanges: true }, (snapshot) => {
          updateConnectionStatus(snapshot);

          // Ecos: ignora en onSnapshot los cambios propios para evitar parpadeos
          if (snapshot.metadata && snapshot.metadata.hasPendingWrites) {
            return;
          }

          if (!snapshot.exists) {
            updateConnectionStatus({ metadata: { fromCache: false } });
            autoRegisterProduccion();
            return;
          }

          const data = snapshot.data();
          if (!data) return;

          const orden = Array.isArray(data.orden) ? data.orden : [];
          const tarjetas = (data.tarjetas && typeof data.tarjetas === 'object') ? data.tarjetas : {};

          const nuevosContenidos = [];
          orden.forEach(cid => {
            if (tarjetas[cid]) {
              const cleaned = cleanCard(tarjetas[cid]);
              if (cleaned) nuevosContenidos.push(cleaned);
            }
          });
          Object.keys(tarjetas).forEach(cid => {
            if (!orden.includes(cid)) {
              const cleaned = cleanCard(tarjetas[cid]);
              if (cleaned) nuevosContenidos.push(cleaned);
            }
          });

          state.contenidos = nuevosContenidos;
          if (data.cliente) state.cliente = data.cliente;
          if (data.fecha) state.fecha = data.fecha;

          document.getElementById('hdr-client').textContent = state.cliente || 'Tablero de Producci\u00f3n';
          document.getElementById('hdr-date').textContent = state.fecha || 'Sin fecha asignada';

          renderCards();
          saveState();
          updateProgressUI();

          // Si el modal de visualización está abierto, actualizar su contenido sin cerrarlo
          if (currentViewId && document.getElementById('view-modal').classList.contains('show')) {
            const currentCard = state.contenidos.find(c => c.id === currentViewId);
            if (currentCard) {
              updateOpenViewModal(currentCard);
            } else {
              closeViewModal();
            }
          }
        }, (err) => {
          console.error('Error onSnapshot produccion:', err);
          updateConnectionStatus(null);
        });
      } catch(e) {
        console.error('Error inicializando Firebase:', e);
      }
    }

    function saveState() {
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
    }

    function createCardElement(c) {
      const el = document.createElement('div');
      el.className = 'card' + (c.estado === 'grabando' ? ' grabando' : '');
      el.dataset.id = escapeHTML(c.id);

      const tipoCfg = TIPOS[c.tipo] || TIPOS['otro'];
      const total = c.subtareas ? c.subtareas.length : 0;
      const done = c.subtareas ? c.subtareas.filter(s => s.done).length : 0;
      const pct = total ? Math.round((done / total) * 100) : 0;

      let sedeBadge = '';
      if (c.sede && c.sede.trim() !== '') {
        sedeBadge = `<div class="card-sede-pill"><i data-lucide="map-pin"></i> ${escapeHTML(c.sede)}</div>`;
      }

      let refsHtml = '';
      if (c.mediaLinks && c.mediaLinks.length > 0) {
        refsHtml = `
          <div class="card-ref-block" onmousedown="event.stopPropagation()">
            <div class="card-ref-info">
              <i data-lucide="film"></i> ${c.mediaLinks.length} Referencia${c.mediaLinks.length > 1 ? 's' : ''}
            </div>
            <button class="btn-secondary" style="padding: 6px 12px; font-size: 11px;" onclick="openMediaModal('${escapeHTML(c.id)}')">Ver</button>
          </div>`;
      }

      let subtasksHtml = '';
      if (total > 0) {
        subtasksHtml = `<div class="checklist">`;
        c.subtareas.forEach(s => {
          subtasksHtml += `
            <label class="check-item" onmousedown="event.stopPropagation()">
              <input type="checkbox" data-cid="${escapeHTML(c.id)}" data-sid="${escapeHTML(s.id)}" ${s.done ? 'checked' : ''}>
              <span>${escapeHTML(s.texto)}</span>
            </label>`;
        });
        subtasksHtml += `</div>`;
      }

      el.addEventListener('click', (e) => {
        if (!e.target.closest('.card-actions') && !e.target.closest('.check-item') && !e.target.closest('.card-ref-block')) {
          openViewModal(c.id);
        }
      });

      el.innerHTML = `
        <div class="card-top">
          <div class="card-type-badge" style="background: ${tipoCfg.g1}">${escapeHTML(tipoCfg.label)}</div>
          <div class="card-actions">
            <button class="btn-micro" onclick="openModal('${escapeHTML(c.id)}')"><i data-lucide="edit-3" style="width:16px;"></i></button>
            <button class="btn-micro" onclick="deleteCard('${escapeHTML(c.id)}')"><i data-lucide="trash-2" style="width:16px;color:#ef4444;"></i></button>
          </div>
        </div>
        <div class="card-title">${escapeHTML(c.titulo)}</div>
        ${sedeBadge}
        ${c.descripcion ? `<div class="card-desc">${escapeHTML(c.descripcion)}</div>` : ''}
        ${refsHtml}
        ${subtasksHtml}
        <div class="c-prog">
          <div class="c-prog-bar">
            <div class="c-prog-fill" style="width: ${pct}%; background: ${tipoCfg.g1}"></div>
          </div>
          <span class="c-prog-text">${done}/${total}</span>
        </div>
      `;
      return el;
    }

    function renderCards() {
      const cols = { todo: document.getElementById('col-todo'), grabando: document.getElementById('col-grabando'), listo: document.getElementById('col-listo') };
      cols.todo.innerHTML = ''; cols.grabando.innerHTML = ''; cols.listo.innerHTML = '';
      let counts = { todo: 0, grabando: 0, listo: 0 };

      state.contenidos.forEach(c => {
        if (searchQuery) {
          const text = (c.titulo + ' ' + (c.descripcion||'')).toLowerCase();
          const subText = c.subtareas ? c.subtareas.map(s => s.texto).join(' ').toLowerCase() : '';
          const refText = c.mediaLinks ? c.mediaLinks.map(r => (r.label + ' ' + r.url)).join(' ').toLowerCase() : '';
          if (!text.includes(searchQuery) && !subText.includes(searchQuery) && !refText.includes(searchQuery)) return;
        }
        if (!c.estado) c.estado = 'todo';
        if (!c.subtareas) c.subtareas = [];
        if (!c.mediaLinks) c.mediaLinks = [];
        cols[c.estado].appendChild(createCardElement(c));
        counts[c.estado]++;
      });

      document.getElementById('count-todo').textContent = counts.todo;
      document.getElementById('count-grabando').textContent = counts.grabando;
      document.getElementById('count-listo').textContent = counts.listo;
      if (window.lucide) lucide.createIcons();
    }

    function updateProgressUI() {
      let totalSub = 0, doneSub = 0;
      state.contenidos.forEach(c => {
        if (c.subtareas) {
          totalSub += c.subtareas.length;
          doneSub += c.subtareas.filter(s => s.done).length;
        }
      });
      const gPct = totalSub ? Math.round((doneSub / totalSub) * 100) : 0;
      const pctEl = document.getElementById('global-pct');
      const fillEl = document.getElementById('global-fill');
      if (pctEl) pctEl.textContent = `${gPct}%`;
      if (fillEl) fillEl.style.width = `${gPct}%`;
    }

      renderCards();

      updateProgressUI();

    function moverEstado(nuevoEstado) {
      if (!currentViewId) return;
      const card = state.contenidos.find(c => c.id === currentViewId);
      if (!card) return;
      card.estado = nuevoEstado;
      if (nuevoEstado === 'listo') card.subtareas.forEach(s => s.done = true);
      else if (nuevoEstado === 'todo') card.subtareas.forEach(s => s.done = false);

    let activeMediaLinks = [];
    let activeMediaIndex = 0;

    function openMediaModal(cardId) {
      const card = state.contenidos.find(c => c.id === cardId);
      if (!card || !card.mediaLinks || card.mediaLinks.length === 0) return;
      activeMediaLinks = card.mediaLinks;
      activeMediaIndex = 0;
      document.getElementById('media-modal').classList.add('show');
      renderCurrentMedia();
    }

    function closeMediaModal() {
      document.getElementById('media-modal').classList.remove('show');
      document.getElementById('media-container').innerHTML = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.getElementById('media-modal').classList.contains('show')) closeMediaModal();
        else if (document.getElementById('edit-modal').classList.contains('show')) closeModal();
        else if (document.getElementById('view-modal').classList.contains('show')) closeViewModal();
      }
    });

    document.getElementById('media-modal').addEventListener('mousedown', (e) => {
      if (e.target === document.getElementById('media-modal')) closeMediaModal();
    });

    document.getElementById('view-modal').addEventListener('mousedown', (e) => {
      if (e.target === document.getElementById('view-modal')) closeViewModal();
    });

    function nextMedia() {
      if (activeMediaIndex < activeMediaLinks.length - 1) { activeMediaIndex++; renderCurrentMedia(); }
    }
    function prevMedia() {
      if (activeMediaIndex > 0) { activeMediaIndex--; renderCurrentMedia(); }
    }

    function renderCurrentMedia() {
      const container = document.getElementById('media-container');
      const btn = document.getElementById('media-original-btn');
      const counter = document.getElementById('media-counter');
      const prevBtn = document.getElementById('media-prev');
      const nextBtn = document.getElementById('media-next');

      const link = activeMediaLinks[activeMediaIndex];
      if (!link) return;

      counter.textContent = `${activeMediaIndex + 1} / ${activeMediaLinks.length}`;
      prevBtn.disabled = activeMediaIndex === 0;
      nextBtn.disabled = activeMediaIndex === activeMediaLinks.length - 1;
      document.getElementById('media-title').textContent = escapeHTML(link.label || link.platform.toUpperCase());
      btn.href = escapeHTML(link.url);

      let html = '';
      const url = link.url;
      const cleanUrl = escapeHTML(url);

      if (link.platform === 'youtube') {
        let yid = '';
        if (url.includes('v=')) yid = url.split('v=')[1].split('&')[0];
        else if (url.includes('youtu.be/')) yid = url.split('youtu.be/')[1].split('?')[0];
        else if (url.includes('shorts/')) yid = url.split('shorts/')[1].split('?')[0];
        else if (url.includes('/embed/')) yid = url.split('/embed/')[1].split('?')[0];
        html = `<iframe src="https://www.youtube.com/embed/${escapeHTML(yid)}?autoplay=0" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe>`;
      } else if (link.platform === 'vimeo') {
        const vid = url.split('/').pop().split('?')[0];
        html = `<iframe src="https://player.vimeo.com/video/${escapeHTML(vid)}?autoplay=0" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe>`;
      } else if (link.platform === 'instagram') {
        const igUrl = url.split('?')[0].replace(/\/$/, '');
        html = `<iframe src="${escapeHTML(igUrl)}/embed" allowtransparency="true" allowfullscreen="true" loading="lazy"></iframe>`;
      } else if (link.platform === 'tiktok' || link.platform === 'facebook') {
        const iconName = link.platform === 'tiktok' ? 'music' : 'facebook';
        const name = link.platform === 'tiktok' ? 'TikTok' : 'Facebook';
        html = `<div style="color:white; text-align:center; padding: 20px;">
          <i data-lucide="${iconName}" style="width:64px;height:64px;margin-bottom:16px;"></i>
          <h3>Publicaci\u00f3n de ${name}</h3>
          <p style="color:#888; font-size:14px; margin-top:8px;">Las pol\u00edticas de la plataforma pueden bloquear inserciones directas.<br>Usa el bot\u00f3n inferior para abrir el contenido original.</p>
        </div>`;
      } else if (link.platform === 'video') {
        html = `<video controls playsinline src="${cleanUrl}"></video>`;
      } else if (link.platform === 'audio') {
        html = `<audio controls src="${cleanUrl}"></audio>`;
      } else if (link.platform === 'image') {
        html = `<img src="${cleanUrl}" alt="Referencia" style="max-height:80vh;">`;
      } else {
        html = `<div style="color:white; text-align:center; padding: 20px;">
          <i data-lucide="external-link" style="width:64px;height:64px;margin-bottom:16px;"></i>
          <h3>Enlace Externo</h3>
          <p style="color:#888; font-size:14px; margin-top:8px;">El contenido no puede previsualizarse aqu\u00ed.</p>
        </div>`;
      }

      const isFile = window.location.protocol === 'file:';
      html += `<div class="media-warning">
        <i data-lucide="info" style="width:16px;height:16px;flex-shrink:0;"></i>
        <div>${isFile ? 'Est\u00e1s ejecutando el archivo localmente. Algunos iframes requieren HTTPS para mostrarse.' : 'Si la plataforma bloquea la previsualizaci\u00f3n, usa el bot\u00f3n "Abrir publicaci\u00f3n original".'}</div>
      </div>`;

      container.innerHTML = html;
      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
